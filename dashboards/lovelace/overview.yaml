              if (isNaN(t)) return '—';
              const h = Math.round((Date.now() - t) / 3600000);
              const u = x => `<span style="font-size:0.65em;font-weight:500;margin-left:2px">${x}</span>`;
              return h < 48 ? `${h}${u('h ago')}` : `${Math.floor(h / 24)}${u('d ago')}`;
