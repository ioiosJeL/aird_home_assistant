            list:
              - justify-self: stretch
              - margin-top: 8px
        extra_styles: |
          #list .r { display: grid; grid-template-columns: 112px 1fr 44px 36px; align-items: center; gap: 8px; padding: 4px 2px; font-size: 0.84rem; border-radius: 6px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
