          #list .t { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
          #list .h { text-align: right; font-size: 0.75rem; font-variant-numeric: tabular-nums; }

      # --- Outside and sky
      - type: heading
        heading: Outside & sky
        icon: mdi:weather-night-partly-cloudy
      - type: weather-forecast
        grid_options:
          columns: full
          rows: auto
        entity: weather.portree
        show_current: false
        show_forecast: true
        forecast_type: hourly
      - type: custom:button-card
        grid_options:
          columns: full
          rows: auto
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: none
        triggers_update:
          - sun.sun
          - sensor.moon
          - sensor.home_aurora_visibility
          - binary_sensor.aurora_visible
        custom_fields:
          sky: |
            [[[
              const more = id => `data-tap onpointerdown="this._p=[event.clientX,event.clientY]" onpointerup="const p=this._p;this._p=null;if(!p||Math.abs(event.clientX-p[0])>10||Math.abs(event.clientY-p[1])>10)return;event.stopPropagation();this.dispatchEvent(new CustomEvent('hass-more-info',{detail:{entityId:'${id}'},bubbles:true,composed:true}))"`;
              const sun = states['sun.sun']?.attributes || {};
              const hm = d => new Date(d).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
              const moon = states['sensor.moon']?.state || '';
              const words = moon.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1));
              const moonIcon = { new_moon: 'moon-new', waxing_crescent: 'moon-waxing-crescent', first_quarter: 'moon-first-quarter',
                waxing_gibbous: 'moon-waxing-gibbous', full_moon: 'moon-full', waning_gibbous: 'moon-waning-gibbous',
                last_quarter: 'moon-last-quarter', waning_crescent: 'moon-waning-crescent' }[moon] || 'moon-waxing-crescent';
              const aur = parseFloat(states['sensor.home_aurora_visibility']?.state) || 0;
              const aurOn = states['binary_sensor.aurora_visible']?.state === 'on';
              const cell = (id, icon, col, v, l) => `<div class="k" ${more(id)}><ha-icon icon="mdi:${icon}" style="color:${col}"></ha-icon><div class="v">${v}</div><div class="l">${l}</div></div>`;
              return cell('sensor.sun_next_rising', 'weather-sunset-up', 'var(--amber-color)', hm(sun.next_rising), 'Sunrise') +
                cell('sensor.sun_next_setting', 'weather-sunset-down', 'var(--deep-orange-color)', hm(sun.next_setting), 'Sunset') +
                cell('sensor.moon', moonIcon, 'var(--primary-text-color)', words[0] || '—', words.slice(1).join(' ') || 'Moon') +
                cell('sensor.home_aurora_visibility', 'aurora', aurOn ? 'var(--green-color)' : 'var(--secondary-text-color)', `${Math.round(aur)}%`, aurOn ? 'Aurora now!' : 'Aurora');
            ]]]
        styles:
          card:
            - padding: 12px 8px
            - cursor: default
          grid:
            - grid-template-areas: '"sky"'
          custom_fields:
            sky:
              - justify-self: stretch
        extra_styles: |
          #sky { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
          #sky .k { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border-radius: 10px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
          #sky .k:active { background: color-mix(in srgb, var(--primary-text-color) 8%, transparent); }
          #sky ha-icon { --mdc-icon-size: 24px; width: 24px; height: 24px; margin: 0; }
          #sky .v { font-size: 1rem; font-weight: 700; }
          #sky .l { font-size: 11px; color: var(--secondary-text-color); }
      - type: custom:button-card
        grid_options:
          columns: full
          rows: auto
        entity: sensor.tide_height
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: more-info
        triggers_update:
          - sensor.tide_height
        custom_fields:
          tide: |
            [[[
              const a = entity?.attributes || {};
              const hm = d => new Date(d).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
              const up = (a.upcoming || []).slice(0, 2);
              const cell = (icon, col, v, l) => `<div class="k"><ha-icon icon="mdi:${icon}" style="color:${col}"></ha-icon><div class="v">${v}</div><div class="l">${l}</div></div>`;
              const h = parseFloat(entity?.state);
              const now = cell(a.trend === 'rising' ? 'arrow-up-bold' : 'arrow-down-bold', 'var(--primary-text-color)',
                isNaN(h) ? '—' : `${h.toFixed(1)} m`, a.trend === 'rising' ? 'Rising' : 'Falling');
              return up.map(e => cell(e.type === 'high' ? 'wave-arrow-up' : 'wave-arrow-down', 'var(--blue-color)',
                hm(e.time), `${e.type === 'high' ? 'High' : 'Low'} · ${e.height.toFixed(1)} m`)).join('') + now;
            ]]]
        styles:
          card:
            - padding: 12px 8px
          grid:
            - grid-template-areas: '"tide"'
          custom_fields:
            tide:
              - justify-self: stretch
        extra_styles: |
          #tide { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
          #tide .k { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; }
          #tide ha-icon { --mdc-icon-size: 24px; width: 24px; height: 24px; margin: 0; }
          #tide .v { font-size: 1rem; font-weight: 700; }
          #tide .l { font-size: 11px; color: var(--secondary-text-color); }

