            visibility:
              - condition: state
                entity: binary_sensor.any_cctv_camera_offline
                state: "on"
      # Latest detection snapshot (written by packages/unifi.yaml)
      - type: custom:button-card
        grid_options:
          columns: full
          rows: auto
        entity: input_text.last_object_camera
        show_icon: false
        show_name: false
        show_state: false
        tap_action:
          action: navigate
          navigation_path: cctv
        triggers_update:
          - input_text.last_object_camera
          - sensor.perimeter_activity_today
          - sensor.date_time_24h
        custom_fields:
          snap: |
            [[[
              const e = entity;
              const v = e ? new Date(e.last_changed).getTime() : 0;
              const cam = (e?.state || '').replace(/_/g, ' ');
              const m = Math.max(0, Math.round((Date.now() - v) / 60000));
              const ago = m < 1 ? 'just now' : m < 60 ? `${m}m ago` : m < 1440 ? `${Math.floor(m / 60)}h ago` : `${Math.floor(m / 1440)}d ago`;
              return `<img src="/local/cctv/latest.jpg?v=${v}" loading="lazy" onerror="this.style.display='none'">` +
                `<div class="cap"><ha-icon icon="mdi:cctv"></ha-icon>Last detection · ${cam} · ${ago}</div>`;
            ]]]
        styles:
          card:
            - padding: 0
            - overflow: hidden
          grid:
            - grid-template-areas: '"snap"'
          custom_fields:
            snap:
              - justify-self: stretch
              - position: relative
        extra_styles: |
          #snap img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }
          #snap .cap { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 6px; padding: 18px 12px 8px; font-size: 0.8rem; font-weight: 600; color: #fff; text-align: left; text-transform: capitalize; background: linear-gradient(transparent, rgba(0,0,0,0.65)); --mdc-icon-size: 16px; }
          #snap .cap ha-icon { --mdc-icon-size: 16px; width: 16px; height: 16px; margin: 0; flex: none; }
