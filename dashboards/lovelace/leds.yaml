            name: Send
            icon: mdi:upload-network-outline
          - type: custom:button-card
            template: [room_toggle, led_sync]
            entity: switch.master_bedroom_mini_square_sync_receive
            name: Receive
            icon: mdi:download-network
          - type: custom:button-card
            template: room_pill
            name: Restart
            icon: mdi:restart
            tap_action:
