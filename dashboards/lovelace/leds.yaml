# LEDs: WLED triptych (dining room) and the three mini squares.
# Three fixed columns: the triptych's three controllers, the three mini
# squares, then whole-group controls and globals. Each controller block is
# the same: status chips (tap the arrow for the device page), power and
# sync toggles, restart, then its preset and playlist.
# Scripts and helpers live in packages/wled.yaml; the dining room scenes
# that drive the triptych are in packages/lights/dining_room_scenes.yaml.
path: leds
title: LEDs
icon: mdi:led-strip-variant
type: sections
max_columns: 3
sections:
  # =====================================================================
  # Column 1: Triptych controllers
  # =====================================================================
  - type: grid
    cards:
      - type: heading
        heading: Triptych
        icon: mdi:view-column
      - type: custom:button-card
        template: chip_row
        variables:
          label: Top
          chips:
            - entity: sensor.triptych_top_uptime
              icon: mdi:clock-outline
              color: red
            - entity: sensor.triptych_top_wi_fi_signal
              icon: mdi:wifi
              color: green
          device_url: /config/devices/device/73c0fb9984093a41fda3a10e1375eecc
          ui_url: http://wled-triptych-top.local/
        triggers_update:
          - sensor.triptych_top_uptime
          - sensor.triptych_top_wi_fi_signal
      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:button-card
            template: room_toggle
            entity: light.triptych_top_main
            name: Power
            icon: mdi:power
            variables:
              color: '#6666FF'
          - type: custom:button-card
            template: [room_toggle, led_sync]
            entity: switch.triptych_top_sync_send
            name: Send
            icon: mdi:upload-network-outline
          - type: custom:button-card
            template: [room_toggle, led_sync]
            entity: switch.triptych_top_sync_receive
            name: Receive
            icon: mdi:download-network
          - type: custom:button-card
            template: room_pill
            name: Restart
            icon: mdi:restart
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.triptych_top_restart
              confirmation:
                text: Restart the Top WLED controller?
      - type: tile
        entity: select.triptych_top_preset
        name: Preset
        hide_state: true
        features_position: bottom
        features:
          - type: select-options
      - type: tile
        entity: select.triptych_top_playlist
        name: Playlist
        hide_state: true
        features_position: bottom
        features:
          - type: select-options
      - type: custom:button-card
        template: chip_row
        variables:
          label: Middle
          chips:
            - entity: sensor.triptych_wow_uptime
              icon: mdi:clock-outline
              color: red
            - entity: sensor.triptych_wow_wi_fi_signal
              icon: mdi:wifi
              color: green
          device_url: /config/devices/device/04c9ff789b426827055f812af8f01bc0
          ui_url: http://wled-triptych-wow.local/
        triggers_update:
          - sensor.triptych_wow_uptime
          - sensor.triptych_wow_wi_fi_signal
      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:button-card
            template: room_toggle
            entity: light.triptych_wow_main
            name: Power
            icon: mdi:power
            variables:
              color: '#6666FF'
          - type: custom:button-card
            template: [room_toggle, led_sync]
            entity: switch.triptych_wow_sync_send
            name: Send
            icon: mdi:upload-network-outline
          - type: custom:button-card
            template: [room_toggle, led_sync]
            entity: switch.triptych_wow_sync_receive
            name: Receive
            icon: mdi:download-network
          - type: custom:button-card
            template: room_pill
            name: Restart
            icon: mdi:restart
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.triptych_wow_restart
              confirmation:
                text: Restart the Middle WLED controller?
      - type: tile
        entity: select.triptych_wow_preset
        name: Preset
        hide_state: true
        features_position: bottom
        features:
          - type: select-options
      - type: tile
        entity: select.triptych_wow_playlist
        name: Playlist
        hide_state: true
        features_position: bottom
        features:
          - type: select-options
      - type: custom:button-card
        template: chip_row
        variables:
          label: Bottom
          chips:
            - entity: sensor.triptych_bottom_uptime
              icon: mdi:clock-outline
              color: red
            - entity: sensor.triptych_bottom_wi_fi_signal
              icon: mdi:wifi
              color: green
          device_url: /config/devices/device/2e39287a248bd77a5795f66992e8cc5f
          ui_url: http://wled-triptych-bottom.local/
        triggers_update:
          - sensor.triptych_bottom_uptime
          - sensor.triptych_bottom_wi_fi_signal
      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:button-card
            template: room_toggle
            entity: light.triptych_bottom_main
            name: Power
            icon: mdi:power
            variables:
              color: '#6666FF'
          - type: custom:button-card
            template: [room_toggle, led_sync]
            entity: switch.triptych_bottom_sync_send
            name: Send
            icon: mdi:upload-network-outline
          - type: custom:button-card
            template: [room_toggle, led_sync]
            entity: switch.triptych_bottom_sync_receive
            name: Receive
            icon: mdi:download-network
          - type: custom:button-card
            template: room_pill
            name: Restart
            icon: mdi:restart
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.triptych_bottom_restart
              confirmation:
                text: Restart the Bottom WLED controller?
      - type: tile
        entity: select.triptych_bottom_preset
        name: Preset
        hide_state: true
        features_position: bottom
        features:
          - type: select-options
      - type: tile
        entity: select.triptych_bottom_playlist
        name: Playlist
        hide_state: true
        features_position: bottom
        features:
          - type: select-options

  # =====================================================================
  # Column 2: Mini squares
  # =====================================================================
  - type: grid
    cards:
      - type: heading
        heading: Mini Squares
        icon: mdi:apps
      - type: custom:button-card
        template: chip_row
        variables:
          label: Living Room
          chips:
            - entity: sensor.living_room_mini_square_estimated_current
              icon: mdi:current-ac
              color: orange
            - entity: sensor.living_room_mini_square_ip
              icon: mdi:ip-network
              color: green
          device_url: /config/devices/device/de31151c16d01db30782d08c2b4406ac
