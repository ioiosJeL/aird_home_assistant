            - entity: sensor.master_bedroom_mini_square_ip
              icon: mdi:ip-network
              color: green
          device_url: /config/devices/device/83704532403cc6385e9ee324f32ac6f9
        triggers_update:
          - sensor.master_bedroom_mini_square_estimated_current
          - sensor.master_bedroom_mini_square_ip
      - type: grid
        columns: 4
