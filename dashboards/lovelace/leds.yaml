  # =====================================================================
  # Column 3: Group control and globals
  # =====================================================================
  - type: grid
    cards:
      - type: heading
        heading: Control
        icon: mdi:tune-variant
      # Mains supply to the triptych (Shelly) and what it is drawing
      - type: tile
        entity: light.dining_room_triptych
        name: Triptych supply
        icon: mdi:power-plug
        features_position: bottom
        features:
          - type: light-brightness
      - type: tile
        entity: sensor.dining_room_triptych_power
        name: Drawing
        icon: mdi:flash
      - type: heading
        heading: Triptych
        icon: mdi:view-column
        heading_style: subtitle
      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:button-card
            template: room_pill
            name: 'On'
            icon: mdi:power-on
            variables:
              active: true
              color: var(--green-color)
            tap_action:
              action: perform-action
              perform_action: script.triptych_set_power
              data:
                turn_on: true
          - type: custom:button-card
            template: room_pill
            name: 'Off'
            icon: mdi:power-off
            variables:
              active: true
              color: var(--red-color)
            tap_action:
              action: perform-action
              perform_action: script.triptych_set_power
              data:
                turn_on: false
          - type: custom:button-card
            template: room_pill
            name: Showoff
            icon: mdi:play
            variables:
              active: true
              color: var(--purple-color)
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              data:
                entity_id: script.triptych_showcase
          - type: custom:button-card
            template: room_pill
            name: Unsync
            icon: mdi:link-variant-off
            variables:
              active: true
              color: var(--grey-color)
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              data:
                entity_id: script.triptych_sync_disable_all
      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:button-card
            template: room_pill
            name: Bright
            icon: mdi:brightness-7
            variables:
              active: true
              color: var(--amber-color)
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              data:
                entity_id: script.triptych_scene_bright
          - type: custom:button-card
            template: room_pill
            name: Relax
            icon: mdi:sofa
            variables:
              active: true
              color: var(--orange-color)
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              data:
                entity_id: script.triptych_scene_relax
          - type: custom:button-card
            template: room_pill
            name: Cosy
            icon: mdi:candle
            variables:
              active: true
              color: var(--deep-orange-color)
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              data:
                entity_id: script.triptych_scene_cosy
          - type: custom:button-card
            template: room_pill
            name: Music
            icon: mdi:music
            variables:
              active: true
              color: var(--pink-color)
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              data:
                entity_id: script.triptych_scene_music
      - type: heading
        heading: Mini Squares
        icon: mdi:apps
        heading_style: subtitle
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:button-card
            template: room_pill
            name: 'On'
            icon: mdi:power-on
            variables:
              active: true
              color: var(--green-color)
            tap_action:
              action: perform-action
              perform_action: script.mini_squares_set_power
              data:
                turn_on: true
          - type: custom:button-card
            template: room_pill
            name: 'Off'
            icon: mdi:power-off
            variables:
              active: true
              color: var(--red-color)
            tap_action:
              action: perform-action
              perform_action: script.mini_squares_set_power
              data:
                turn_on: false
          - type: custom:button-card
            template: room_pill
            name: Random
            icon: mdi:dice-multiple
            variables:
              active: true
              color: var(--purple-color)
            tap_action:
              action: perform-action
              perform_action: input_select.random
              data:
                entity_id: input_select.mini_squares_presets
      - type: tile
        entity: input_select.mini_squares_presets
        name: Preset (all squares)
        icon: mdi:shape
        hide_state: true
        features_position: bottom
        features:
          - type: select-options
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:button-card
            template: room_toggle
            entity: input_boolean.mini_square_sync
            name: Sync
            icon: mdi:sync
            variables:
              color: var(--blue-color)
          - type: custom:button-card
            template: room_toggle
            entity: input_boolean.mini_squares_notify_active
            name: Notify
            icon: mdi:bell
            variables:
              color: var(--blue-color)
          - type: custom:button-card
            template: room_pill
            entity: sensor.perimeter_activity_today
            icon: mdi:shape
            name: '[[[ return `${entity?.state ?? ''—''} today`; ]]]'
            tap_action:
              action: more-info
