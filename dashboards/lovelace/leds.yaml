          chips:
            - entity: sensor.workshop_mini_square_estimated_current
              icon: mdi:current-ac
              color: orange
            - entity: sensor.workshop_mini_square_ip
              icon: mdi:ip-network
              color: green
          device_url: /config/devices/device/8f2dbbc388b11808c34474e93a02817d
        triggers_update:
          - sensor.workshop_mini_square_estimated_current
          - sensor.workshop_mini_square_ip
      - type: grid
        columns: 4
        square: false
        cards:
          - type: custom:button-card
            template: room_toggle
            entity: light.workshop_mini_square
            name: Power
            icon: mdi:power
            variables:
              color: '#6666FF'
          - type: custom:button-card
            template: [room_toggle, led_sync]
            entity: switch.workshop_mini_square_sync_send
            name: Send
            icon: mdi:upload-network-outline
          - type: custom:button-card
            template: [room_toggle, led_sync]
            entity: switch.workshop_mini_square_sync_receive
