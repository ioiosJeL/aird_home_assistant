            - type: custom:button-card
              template: room_scene
              entity: input_select.single_bedroom_scenes
              icon: mdi:fire
              variables:
                option: Cosy
                color: "var(--deep-orange-color)"
            - type: custom:button-card
              template: room_scene
              entity: input_select.single_bedroom_scenes
              icon: mdi:power
              variables:
                option: "Off"
                color: "var(--red-color)"
      toggles:
        card:
          type: grid
          square: false
