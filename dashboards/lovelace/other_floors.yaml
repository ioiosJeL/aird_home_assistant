  - type: custom:button-card
    template: room_card
    name: Patio
    icon: mdi:table-chair
    entity: light.patio_light
    triggers_update:
      - sensor.homs_patio_temperature
      - sensor.homs_patio_illuminance
      - binary_sensor.patio_motion
    variables:
      temp: sensor.homs_patio_temperature
      second: sensor.homs_patio_illuminance
