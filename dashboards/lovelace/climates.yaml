path: climates
title: Climates
type: custom:masonry-layout
layout:
  width: 350
  max_width: 5000
  max_cols: 4
cards:
  - type: custom:stack-in-card
    mode: vertical
    cards:
      - type: tile
        entity: climate.dining_room
        name: Dining Room
        icon: mdi:silverware-fork-knife
        content_layout: vertical
        tap_action:
          action: more-info
      - type: horizontal-stack
        cards:
          - type: custom:button-card
            template: room_pill
            icon: mdi:thermometer-minus
            show_name: false
            variables:
              active: true
              color: var(--blue-color)
            tap_action:
              action: perform-action
              perform_action: script.climate_decrement
              data:
                entity: climate.dining_room
                step: 1
          - type: custom:button-card
            template: room_pill
            entity: climate.dining_room
            icon: mdi:thermometer
            triggers_update:
              - climate.dining_room
              - switch.dining_room_heater
            name: '[[[ const t = parseFloat(entity?.attributes.temperature); return isNaN(t) ? ''—'' : `${t.toFixed(1)}°C`; ]]]'
            variables:
              color: var(--orange-color)
              active: '[[[ return states[''switch.dining_room_heater'']?.state === ''on''; ]]]'
            tap_action:
              action: more-info
            hold_action:
              action: more-info
          - type: custom:button-card
            template: room_pill
            icon: mdi:thermometer-plus
            show_name: false
            variables:
              active: true
              color: var(--orange-color)
            tap_action:
              action: perform-action
              perform_action: script.climate_increment
              data:
                entity: climate.dining_room
                step: 1
      - type: custom:button-card
        template: value_tile
        entity: sensor.daily_dining_room_heater_energy_usage
        name: Today
        icon: mdi:lightning-bolt
        triggers_update:
          - sensor.daily_dining_room_heater_energy_usage
          - switch.dining_room_heater
        variables:
          format: kwh
        styles:
          icon:
            - color: '[[[ return states[''switch.dining_room_heater'']?.state === ''on'' ? ''var(--orange-color)'' : ''var(--secondary-text-color)''; ]]]'
        tap_action:
          action: none
      - type: custom:mini-graph-card
        entities:
          - entity: sensor.dining_room_average_temperature
            name: Average
        hours_to_show: 2
        update_interval: 30
        points_per_hour: 30
        line_width: 3
        align_state: center
        name: Temperature Data
        show:
          name: false
          icon: false
          state: false
          labels: true
