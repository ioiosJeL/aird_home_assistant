# Electrical supply overview - live usage, area breakdown, voltage
# Sensors come from packages/electrical.yaml
path: electrical
title: Electrical
icon: mdi:transmission-tower
type: custom:masonry-layout
layout:
  width: 400
  max_width: 5000
  max_cols: 3
cards:
  - type: custom:button-card
    entity: sensor.whole_house_power
    show_name: false
    show_icon: false
    show_state: false
    triggers_update:
      - sensor.whole_house_power
      - sensor.whole_house_voltage
      - sensor.daily_energy_usage
      - sensor.daily_energy_cost
    tap_action:
      action: more-info
    styles:
      card:
        - padding: "16px"
        - cursor: default
      grid:
        - grid-template-areas: "\"diagram\""
        - grid-template-columns: "1fr"
        - grid-template-rows: auto
      custom_fields:
        diagram:
          - justify-self: stretch
          - text-align: left
    custom_fields:
      diagram: |-
        [[[
        const n = id => { const s = states[id]; const x = s ? parseFloat(s.state) : NaN; return isNaN(x) ? null : x; };
        const p = n('sensor.whole_house_power');
        const big = p === null ? '–' : (p >= 1000 ? (p / 1000).toFixed(2) : Math.round(p));
        const unit = p !== null && p >= 1000 ? 'kW' : 'W';
        const v = n('sensor.whole_house_voltage');
        const kwh = n('sensor.daily_energy_usage');
        const cost = n('sensor.daily_energy_cost');
        const stat = (label, val) => `<div class="st"><div class="sv">${val}</div><div class="sl">${label}</div></div>`;
        return `
        <style>
          .hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
          .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--secondary-text-color)}
          .big{font-size:52px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:var(--primary-text-color)}
          .big span{font-size:22px;font-weight:400;margin-left:4px;color:var(--secondary-text-color)}
          .stats{display:flex;gap:20px}
          .st{text-align:right}
          .sv{font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--primary-text-color)}
          .sl{font-size:11px;color:var(--secondary-text-color)}
        </style>
        <div class="hero">
          <div><div class="lbl">Using now</div><div class="big">${big}<span>${unit}</span></div></div>
          <div class="stats">
            ${stat('Supply', v === null ? '–' : v.toFixed(1) + ' V')}
            ${stat('Today', kwh === null ? '–' : kwh.toFixed(1) + ' kWh')}
            ${stat('Cost today', cost === null ? '–' : '£' + cost.toFixed(2))}
          </div>
        </div>`;
        ]]]
  - type: custom:button-card
    entity: sensor.whole_house_power
    show_name: false
    show_icon: false
    show_state: false
    triggers_update:
      - sensor.whole_house_power
      - sensor.whole_house_voltage
      - sensor.electrical_peak_power_today
      - sensor.electrical_baseload
      - sensor.electrical_min_voltage_today
      - sensor.electrical_max_voltage_today
    tap_action:
      action: more-info
    styles:
      card:
        - padding: "16px"
        - cursor: default
      grid:
        - grid-template-areas: "\"diagram\""
        - grid-template-columns: "1fr"
        - grid-template-rows: auto
      custom_fields:
        diagram:
          - justify-self: stretch
          - text-align: left
    custom_fields:
      diagram: |-
        [[[
        const n = id => { const s = states[id]; const x = s ? parseFloat(s.state) : NaN; return isNaN(x) ? null : x; };
        const TARIFF = 0.2604; // £/kWh, same fixed tariff as the Energy dashboard
        const fmtW = w => w === null ? '–' : (w >= 1000 ? (w / 1000).toFixed(2) + ' kW' : Math.round(w) + ' W');
        const p = n('sensor.whole_house_power');
        const peak = n('sensor.electrical_peak_power_today');
        const peakAt = states['sensor.electrical_peak_power_today']?.attributes?.at;
        const peakT = peakAt ? new Date(peakAt).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'}) : '';
        const base = n('sensor.electrical_baseload');
        const v = n('sensor.whole_house_voltage');
        const lo = n('sensor.electrical_min_voltage_today');
        const hi = n('sensor.electrical_max_voltage_today');

        const tile = (icon, label, val, sub) => `<div class="tl">
          <div class="tlh"><ha-icon icon="${icon}"></ha-icon>${label}</div>
          <div class="tv">${val}</div><div class="ts">${sub}</div></div>`;

        // UK statutory supply limits: 230 V +10 % / −6 %
        const MIN = 216.2, MAX = 253.0, A = 210, B = 258;
        const x = val => Math.max(0, Math.min((val - A) / (B - A) * 100, 100));
        const ok = lo === null || hi === null || (lo >= MIN && hi <= MAX);
        const range = lo !== null && hi !== null
          ? `<div class="rg" style="left:${x(lo)}%;width:${Math.max(x(hi) - x(lo), 0.8)}%;background:${ok ? 'var(--success-color,#43a047)' : 'var(--error-color,#db4437)'}"></div>` : '';
        const now = v !== null ? `<div class="nw" style="left:${x(v)}%"></div>` : '';

        return `
        <style>
          .t{font-size:16px;font-weight:500;color:var(--primary-text-color);margin-bottom:12px}
          .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
          .tl{background:var(--secondary-background-color);border-radius:10px;padding:10px 12px;min-width:0}
          .tlh{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--secondary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .tlh ha-icon{--mdc-icon-size:14px}
          .tv{font-size:20px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--primary-text-color)}
          .ts{font-size:11px;color:var(--secondary-text-color);margin-top:2px}
          .vq{margin-top:16px}
          .vqh{display:flex;justify-content:space-between;font-size:13px;color:var(--primary-text-color);margin-bottom:8px}
          .vqh span{color:var(--secondary-text-color);font-size:12px}
          .scale{position:relative;height:14px;border-radius:7px;background:var(--divider-color)}
          .band{position:absolute;top:0;bottom:0;background:var(--primary-text-color);opacity:.08;border-radius:7px}
          .rg{position:absolute;top:3px;bottom:3px;border-radius:4px}
          .nw{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;border-radius:2px;background:var(--primary-text-color)}
          .ax{position:relative;height:14px;font-size:10px;color:var(--secondary-text-color);margin-top:3px}
          .ax span{position:absolute;transform:translateX(-50%)}
          @media (max-width:420px){.tiles{grid-template-columns:1fr 1fr}.tiles .tl:last-child{grid-column:span 2}}
        </style>
        <div class="t">Today at a glance</div>
        <div class="tiles">
          ${tile('mdi:cash-clock', 'Cost right now', p === null ? '–' : '£' + (p / 1000 * TARIFF).toFixed(2) + '/h', p === null ? '' : '≈ £' + (p / 1000 * TARIFF * 24).toFixed(2) + ' a day at this rate')}
          ${tile('mdi:chart-bell-curve', 'Peak today', fmtW(peak), peakT ? 'at ' + peakT : '')}
          ${tile('mdi:power-sleep', 'Always-on', fmtW(base), base === null ? '' : '£' + Math.round(base / 1000 * 8760 * TARIFF) + ' a year')}
        </div>
        <div class="vq">
          <div class="vqh">Supply today ${lo !== null && hi !== null ? lo.toFixed(1) + '–' + hi.toFixed(1) + ' V' : ''}
            <span>${ok ? 'within statutory limits' : 'outside statutory limits'}</span></div>
          <div class="scale"><div class="band" style="left:${x(MIN)}%;width:${x(MAX) - x(MIN)}%"></div>${range}${now}</div>
          <div class="ax"><span style="left:${x(MIN)}%">216</span><span style="left:${x(230)}%">230</span><span style="left:${x(MAX)}%">253</span></div>
        </div>`;
        ]]]
  - type: custom:button-card
    entity: sensor.whole_house_power
    show_name: false
    show_icon: false
    show_state: false
    triggers_update:
      - sensor.whole_house_power
      - sensor.electrical_shower_power
      - sensor.electrical_hot_water_power
      - sensor.electrical_workspace_power
      - sensor.electrical_house_heating_power
      - sensor.electrical_kitchen_power
      - sensor.electrical_utility_power
      - sensor.electrical_lighting_power
      - sensor.electrical_unmeasured_power
    tap_action:
      action: more-info
    styles:
      card:
        - padding: "16px"
        - cursor: default
      grid:
        - grid-template-areas: "\"diagram\""
        - grid-template-columns: "1fr"
        - grid-template-rows: auto
      custom_fields:
        diagram:
          - justify-self: stretch
          - text-align: left
    custom_fields:
      diagram: |-
        [[[
        const n = id => { const s = states[id]; const x = s ? parseFloat(s.state) : NaN; return isNaN(x) ? 0 : x; };
        const areas = [
          ['Shower', 'mdi:shower-head', 'sensor.electrical_shower_power', '#4e79a7'],
          ['Hot water', 'mdi:water-boiler', 'sensor.electrical_hot_water_power', '#f28e2b'],
          ['Workspace', 'mdi:garage-variant', 'sensor.electrical_workspace_power', '#e15759'],
          ['Heating', 'mdi:radiator', 'sensor.electrical_house_heating_power', '#edc948'],
          ['Kitchen', 'mdi:fridge-outline', 'sensor.electrical_kitchen_power', '#59a14f'],
          ['Utility & IT', 'mdi:washing-machine', 'sensor.electrical_utility_power', '#76b7b2'],
          ['Lighting', 'mdi:lightbulb-group-outline', 'sensor.electrical_lighting_power', '#b07aa1'],
          ['Unmeasured', 'mdi:help-circle-outline', 'sensor.electrical_unmeasured_power', '#9e9e9e'],
        ].map(([name, icon, id, col]) => ({name, icon, id, col, w: n(id)}));
        const total = Math.max(n('sensor.whole_house_power'), areas.reduce((a, b) => a + b.w, 0), 1);
        areas.sort((a, b) => b.w - a.w);
        const fmtW = w => w >= 1000 ? (w / 1000).toFixed(2) + ' kW' : Math.round(w) + ' W';
        const top = areas[0];
        const seg = areas.filter(a => a.w > 0).map(a =>
          `<div style="flex:${a.w} 0 0;background:${a.col}" title="${a.name} ${fmtW(a.w)}"></div>`).join('');
        const rows = areas.map(a => {
          const pct = a.w / total * 100;
          return `<div class="r ${a.w < 1 ? 'idle' : ''}">
            <b style="background:${a.col}"></b>
            <ha-icon icon="${a.icon}"></ha-icon>
            <div class="nm">${a.name}</div>
            <div class="bar"><div style="width:${pct}%;background:${a.col}"></div></div>
            <div class="w">${fmtW(a.w)}</div>
            <div class="p">${pct.toFixed(0)}%</div>
          </div>`;
        }).join('');
        return `
        <style>
          .t{font-size:16px;font-weight:500;color:var(--primary-text-color);margin-bottom:2px}
          .sub{font-size:12px;color:var(--secondary-text-color);margin-bottom:12px}
          .stack{display:flex;gap:2px;height:28px;border-radius:6px;overflow:hidden;background:var(--divider-color);margin-bottom:14px}
          .r{display:grid;grid-template-columns:8px 20px minmax(0,1fr) minmax(40px,1.2fr) 64px 36px;align-items:center;gap:8px;padding:4px 0;font-size:14px}
          .r.idle{opacity:.45}
          .r>b{width:8px;height:8px;border-radius:50%}
          .r ha-icon{--mdc-icon-size:18px;color:var(--secondary-text-color)}
          .nm{color:var(--primary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .bar{height:6px;border-radius:3px;background:var(--divider-color);overflow:hidden}
          .bar>div{height:100%;border-radius:3px}
          .w,.p{text-align:right;font-variant-numeric:tabular-nums;color:var(--primary-text-color)}
          .p{font-size:12px;color:var(--secondary-text-color)}
        </style>
        <div class="t">Where the power is going</div>
        <div class="sub">Right now, ${top.w >= 1 ? `<b>${top.name}</b> is the biggest load at ${fmtW(top.w)} (${(top.w / total * 100).toFixed(0)}%)` : 'nothing significant is running'}.</div>
        <div class="stack">${seg}</div>
        ${rows}`;
        ]]]
  - type: custom:button-card
    entity: sensor.daily_energy_usage
    show_name: false
    show_icon: false
    show_state: false
    triggers_update:
      - sensor.daily_energy_usage
      - sensor.electrical_shower_energy_today
      - sensor.electrical_hot_water_energy_today
      - sensor.electrical_workspace_energy_today
      - sensor.electrical_house_heating_energy_today
      - sensor.electrical_kitchen_energy_today
      - sensor.electrical_utility_energy_today
      - sensor.electrical_lighting_energy_today
      - sensor.electrical_unmeasured_energy_today
    tap_action:
      action: more-info
    styles:
      card:
        - padding: "16px"
        - cursor: default
      grid:
        - grid-template-areas: "\"diagram\""
        - grid-template-columns: "1fr"
        - grid-template-rows: auto
      custom_fields:
        diagram:
          - justify-self: stretch
          - text-align: left
    custom_fields:
      diagram: |-
        [[[
        const n = id => { const s = states[id]; const x = s ? parseFloat(s.state) : NaN; return isNaN(x) ? 0 : x; };
        const TARIFF = 0.2604; // £/kWh, same fixed tariff as the Energy dashboard
        const areas = [
          ['Shower', 'mdi:shower-head', 'sensor.electrical_shower_energy_today', '#4e79a7'],
          ['Hot water', 'mdi:water-boiler', 'sensor.electrical_hot_water_energy_today', '#f28e2b'],
          ['Workspace', 'mdi:garage-variant', 'sensor.electrical_workspace_energy_today', '#e15759'],
          ['Heating', 'mdi:radiator', 'sensor.electrical_house_heating_energy_today', '#edc948'],
          ['Kitchen', 'mdi:fridge-outline', 'sensor.electrical_kitchen_energy_today', '#59a14f'],
          ['Utility & IT', 'mdi:washing-machine', 'sensor.electrical_utility_energy_today', '#76b7b2'],
          ['Lighting', 'mdi:lightbulb-group-outline', 'sensor.electrical_lighting_energy_today', '#b07aa1'],
          ['Unmeasured', 'mdi:help-circle-outline', 'sensor.electrical_unmeasured_energy_today', '#9e9e9e'],
        ].map(([name, icon, id, col]) => ({name, icon, id, col, k: n(id)}));
        const total = Math.max(n('sensor.daily_energy_usage'), areas.reduce((a, b) => a + b.k, 0), 0.001);
        areas.sort((a, b) => b.k - a.k);
        const top = areas[0];
        const rows = areas.map(a => {
          const pct = a.k / total * 100;
          return `<div class="r ${a.k < 0.01 ? 'idle' : ''}">
            <b style="background:${a.col}"></b>
            <ha-icon icon="${a.icon}"></ha-icon>
            <div class="nm">${a.name}</div>
            <div class="bar"><div style="width:${pct}%;background:${a.col}"></div></div>
            <div class="w">${a.k.toFixed(1)} kWh</div>
            <div class="p">£${(a.k * TARIFF).toFixed(2)}</div>
          </div>`;
        }).join('');
        return `
        <style>
          .t{font-size:16px;font-weight:500;color:var(--primary-text-color);margin-bottom:2px}
          .sub{font-size:12px;color:var(--secondary-text-color);margin-bottom:12px}
          .r{display:grid;grid-template-columns:8px 20px minmax(0,1fr) minmax(40px,1.2fr) 70px 44px;align-items:center;gap:8px;padding:4px 0;font-size:14px}
          .r.idle{opacity:.45}
          .r>b{width:8px;height:8px;border-radius:50%}
          .r ha-icon{--mdc-icon-size:18px;color:var(--secondary-text-color)}
          .nm{color:var(--primary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .bar{height:6px;border-radius:3px;background:var(--divider-color);overflow:hidden}
          .bar>div{height:100%;border-radius:3px}
          .w,.p{text-align:right;font-variant-numeric:tabular-nums;color:var(--primary-text-color)}
          .p{font-size:12px;color:var(--secondary-text-color)}
        </style>
        <div class="t">Energy today by area</div>
        <div class="sub">${total.toFixed(1)} kWh since midnight, £${(total * TARIFF).toFixed(2)}${top.k >= 0.01 ? `. <b>${top.name}</b> has used the most` : ''}.</div>
        ${rows}`;
        ]]]
  - type: custom:button-card
    # Ranked server-side by sensor.electrical_biggest_loads (packages/electrical.yaml)
    entity: sensor.electrical_biggest_loads
    show_name: false
    show_icon: false
    show_state: false
    tap_action:
      action: more-info
      entity: sensor.whole_house_power
    styles:
      card:
        - padding: "16px"
        - cursor: default
      grid:
        - grid-template-areas: "\"diagram\""
        - grid-template-columns: "1fr"
        - grid-template-rows: auto
      custom_fields:
        diagram:
          - justify-self: stretch
          - text-align: left
    custom_fields:
      diagram: |-
        [[[
        const fmtW = w => w >= 1000 ? (w / 1000).toFixed(2) + ' kW' : Math.round(w) + ' W';
        const shown = entity?.attributes.top || [];
        const total = parseInt(entity?.state) || 0;
        const max = Math.max(shown.length ? shown[0].w : 1, 1);
        const rows = shown.map((d, i) => `<div class="r">
            <div class="rk">${i + 1}</div>
            <div class="nm">${d.name}</div>
            <div class="bar"><div style="width:${d.w / max * 100}%"></div></div>
            <div class="w">${fmtW(d.w)}</div>
          </div>`).join('');
        return `
        <style>
          .t{font-size:16px;font-weight:500;color:var(--primary-text-color);margin-bottom:2px}
          .sub{font-size:12px;color:var(--secondary-text-color);margin-bottom:12px}
          .r{display:grid;grid-template-columns:18px minmax(0,1.4fr) minmax(40px,1fr) 64px;align-items:center;gap:8px;padding:4px 0;font-size:14px}
          .rk{font-size:12px;color:var(--secondary-text-color);text-align:right;font-variant-numeric:tabular-nums}
          .nm{color:var(--primary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .bar{height:6px;border-radius:3px;background:var(--divider-color);overflow:hidden}
          .bar>div{height:100%;border-radius:3px;background:var(--primary-color)}
          .w{text-align:right;font-variant-numeric:tabular-nums;color:var(--primary-text-color)}
          .none{font-size:14px;color:var(--secondary-text-color);padding:8px 0}
        </style>
        <div class="t">Biggest loads right now</div>
        <div class="sub">${total} metered device${total === 1 ? '' : 's'} drawing power${total > 10 ? ', top 10 shown' : ''}.</div>
        ${rows || '<div class="none">Nothing metered is drawing power.</div>'}`;
        ]]]
  - type: custom:button-card
    entity: sensor.electrical_house_heating_power
    show_name: false
    show_icon: false
    show_state: false
    triggers_update:
      - sensor.dining_room_heater_power
      - sensor.living_room_heater_power
      - sensor.kitchen_heater_power
      - sensor.bathroom_heater_power
      - sensor.shower_room_heater_power
      - sensor.sunroom_heater_power
      - sensor.master_bedroom_heater_power
      - sensor.double_bedroom_heater_power
      - sensor.workshop_heater_power
      - sensor.machine_room_heater_power
      - sensor.daily_dining_room_heater_energy_usage
      - sensor.daily_living_room_heater_energy_usage
      - sensor.daily_kitchen_heater_energy_usage
      - sensor.daily_bathroom_heater_energy_usage
      - sensor.daily_shower_room_heater_energy_usage
      - sensor.daily_sunroom_heater_energy_usage
      - sensor.daily_master_bedroom_heater_energy_usage
      - sensor.daily_double_bedroom_heater_energy_usage
      - sensor.daily_workshop_heater_energy_usage
      - sensor.daily_machine_room_heater_energy_usage
    tap_action:
      action: more-info
    styles:
      card:
        - padding: "16px"
        - cursor: default
      grid:
        - grid-template-areas: "\"diagram\""
        - grid-template-columns: "1fr"
        - grid-template-rows: auto
      custom_fields:
        diagram:
          - justify-self: stretch
          - text-align: left
    custom_fields:
      diagram: |-
        [[[
        const n = id => { const s = states[id]; const x = s ? parseFloat(s.state) : NaN; return isNaN(x) ? 0 : x; };
        const TARIFF = 0.2604; // £/kWh, same fixed tariff as the Energy dashboard
        const rooms = [
          ['Dining room', 'dining_room'], ['Living room', 'living_room'], ['Kitchen', 'kitchen'],
          ['Bathroom', 'bathroom'], ['Shower room', 'shower_room'], ['Sunroom', 'sunroom'],
          ['Master bedroom', 'master_bedroom'], ['Double bedroom', 'double_bedroom'],
          ['Workshop', 'workshop'], ['Machine room', 'machine_room'],
        ].map(([name, key]) => ({name,
          w: n(`sensor.${key}_heater_power`),
          k: n(`sensor.daily_${key}_heater_energy_usage`)}))
          // A room appears once its heater has used something today or is on now
          .filter(r => r.k >= 0.01 || r.w > 5);
        rooms.sort((a, b) => b.k - a.k || b.w - a.w);
        const totK = rooms.reduce((a, b) => a + b.k, 0);
        const totW = rooms.reduce((a, b) => a + b.w, 0);
        const on = rooms.filter(r => r.w > 5).length;
        const max = Math.max(rooms[0]?.k || 0, 0.001);
        const fmtW = w => w >= 1000 ? (w / 1000).toFixed(1) + ' kW' : Math.round(w) + ' W';
        const rows = rooms.map(r => `<div class="r ${r.k < 0.01 && r.w <= 5 ? 'idle' : ''}">
            <ha-icon icon="mdi:radiator" style="color:${r.w > 5 ? 'var(--state-climate-heat-color,#ff8100)' : 'var(--disabled-text-color)'}"></ha-icon>
            <div class="nm">${r.name}${r.w > 5 ? `<small>${fmtW(r.w)} now</small>` : ''}</div>
            <div class="bar"><div style="width:${r.k / max * 100}%"></div></div>
            <div class="w">${r.k.toFixed(1)} kWh</div>
            <div class="p">£${(r.k * TARIFF).toFixed(2)}</div>
          </div>`).join('') || '<div class="none">No heating used yet today.</div>';
        return `
        <style>
          .t{font-size:16px;font-weight:500;color:var(--primary-text-color);margin-bottom:2px}
          .sub{font-size:12px;color:var(--secondary-text-color);margin-bottom:12px}
          .r{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(40px,1fr) 70px 44px;align-items:center;gap:8px;padding:4px 0;font-size:14px}
          .r.idle{opacity:.45}
          .r ha-icon{--mdc-icon-size:18px}
          .nm{color:var(--primary-text-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .nm small{display:block;font-size:11px;color:var(--state-climate-heat-color,#ff8100)}
          .none{font-size:14px;color:var(--secondary-text-color)}
          .bar{height:6px;border-radius:3px;background:var(--divider-color);overflow:hidden}
          .bar>div{height:100%;border-radius:3px;background:var(--state-climate-heat-color,#ff8100)}
          .w,.p{text-align:right;font-variant-numeric:tabular-nums;color:var(--primary-text-color)}
          .p{font-size:12px;color:var(--secondary-text-color)}
        </style>
        <div class="t">Heating today</div>
        <div class="sub">${totK.toFixed(1)} kWh, £${(totK * TARIFF).toFixed(2)} so far. ${on ? `${on} heater${on === 1 ? '' : 's'} on, drawing ${fmtW(totW)}.` : 'All heaters idle.'}</div>
        ${rows}`;
        ]]]
  - type: custom:mini-graph-card
    name: Voltage at each point
    icon: mdi:sine-wave
