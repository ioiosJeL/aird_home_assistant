blueprint:
  name: Climate - Boost Cancel
  description: >-
    Cancel a room's heating boost early: clear the active flag, cancel the
    boost timer, and drop the thermostat's target temperature back down by
    the room's configured boost value.
  domain: script
  input:
    boost_active_boolean:
      name: Boost Active (input_boolean)
      selector:
        entity:
          domain: input_boolean
    boost_timer:
      name: Boost Timer
      selector:
        entity:
          domain: timer
    climate_entity:
      name: Climate Entity
      selector:
        entity:
          domain: climate
    boost_value_number:
      name: Boost Value, Degrees (input_number)
      selector:
        entity:
          domain: input_number

mode: single
variables:
  climate_entity: !input climate_entity
  boost_value_number: !input boost_value_number

sequence:
  - action: input_boolean.turn_off
    target:
      entity_id: !input boost_active_boolean
  - action: timer.cancel
    data:
      entity_id: !input boost_timer
  - action: climate.set_temperature
    data:
      entity_id: "{{ climate_entity }}"
      temperature: "{{ state_attr(climate_entity, 'temperature') - states(boost_value_number) | int }}"
