  daily_bathroom_heater_energy:
    source: sensor.bathroom_heater_energy
    name: Daily Bathroom Heater Energy Usage
    unique_id: daily_bathroom_heater_energy_usage
    <<: *utility_meter_daily

  daily_sunroom_heater_energy:
    source: sensor.sunroom_heater_energy
    name: Daily Sunroom Heater Energy Usage
    unique_id: daily_sunroom_heater_energy_usage
    <<: *utility_meter_daily

  daily_master_bedroom_heater_energy:
    source: sensor.master_bedroom_heater_energy
