  boost_cancel_dining_room:
    alias: Cancel Boost For Dining Room
    use_blueprint:
      path: climate/boost_cancel.yaml
      input:
        boost_active_boolean: input_boolean.boost_dining_room
        boost_timer: timer.boost_dining_room
        climate_entity: climate.dining_room
        boost_value_number: input_number.boost_dining_room_value

  boost_cancel_shower_room:
    alias: Cancel Boost For Shower Room
    use_blueprint:
      path: climate/boost_cancel.yaml
      input:
