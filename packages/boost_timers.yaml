  boost_cancel_sunroom:
    alias: Cancel Boost For Sunroom
    use_blueprint:
      path: climate/boost_cancel.yaml
      input:
        boost_active_boolean: input_boolean.boost_sunroom
        boost_timer: timer.boost_sunroom
