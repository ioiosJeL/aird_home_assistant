    has_time: true

# Snooze: while active, everything except critical alerts is held back
# (logged to the notification history but not sent).
timer:
  notify_snooze:
    name: "Notifications Snoozed"
    icon: mdi:bell-sleep
    restore: true


script:
  notify_dispatch:
    alias: Notify Dispatch
    description: >-
      Shared fan-out for John's devices / Elizabeth's phone / kitchen speaker,
      gated per event by the input_boolean.notify_<event>_<channel> helpers
      above, by Snooze (everything) and by per-alert mutes
      (sensor.notify_mutes, packages/camera_alerts.yaml). Call with `event`
      set to the preference key (e.g. "camera_person").
    mode: queued
    max: 10
    fields:
      event:
        description: "Notification preference key, e.g. camera_person"
        example: "camera_person"
      message:
        description: "Plain text message body"
        example: "Person detected in driveway"
      title:
        description: "Push notification title"
        default: "Aird Point"
      critical:
        description: "Send mobile pushes as a critical/urgent alert (bypasses silent mode, snooze and mutes)"
        default: false
        selector:
          boolean:
      push_actions:
        description: >-
          Optional actionable-notification buttons for the mobile pushes, e.g.
          [{action: LIGHTS_OFF, title: Turn lights off}]. Handled by
          automations listening for mobile_app_notification_action.
          MUTE__<event>__<minutes> is handled for every event (camera_alerts.yaml).
        default: []
      image:
        description: >-
          Optional picture for the pushes: an /api/... path (fetched with the
          app's login, e.g. /api/camera_proxy/camera.driveway_medium) or a
          /local/... path.
        default: ""
      camera:
        description: Optional camera entity; iPhone/iPad show its live feed when the notification is expanded
        default: ""
      url:
        description: Optional dashboard path opened when the notification is tapped
        default: ""
      group:
        description: Optional group/thread so related notifications stack together
        default: ""
    sequence:
      # Field defaults are only UI hints, so apply them here
      - variables:
          title: "{{ title | default('Aird Point') }}"
          critical: "{{ critical | default(false) | bool }}"
          image: "{{ image | default('') }}"
          camera: "{{ camera | default('') }}"
          url: "{{ url | default('') }}"
          group: "{{ group | default('') }}"
          # Snooze holds back everything but critical alerts
          snoozed: "{{ is_state('timer.notify_snooze', 'active') and not critical }}"
          # Per-alert mutes (from notification buttons or the admin page)
          muted: >-
            {% set u = state_attr('sensor.notify_mutes', 'until') or {} %}
            {{ not critical and event in u and as_timestamp(u[event], 0) > as_timestamp(now()) }}
          held: "{{ 'snoozed' if snoozed else 'muted' if muted else '' }}"
          # Quiet hours only mute the kitchen speaker (never critical alerts)
          quiet: >-
            {% set st = states('input_datetime.notify_quiet_start') %}
            {% set en = states('input_datetime.notify_quiet_end') %}
            {% set t = now().strftime('%H:%M:%S') %}
            {% set inside = (st <= t < en) if st <= en else (t >= st or t < en) %}
            {{ is_state('input_boolean.notify_quiet_hours', 'on') and not critical and inside }}
          johns_devices_on: "{{ held == '' and is_state('input_boolean.notify_' ~ event ~ '_johns_devices', 'on') }}"
          elizabeth_on: "{{ held == '' and is_state('input_boolean.notify_' ~ event ~ '_elizabeth', 'on') }}"
          kitchen_tts_on: "{{ held == '' and not quiet and is_state('input_boolean.notify_' ~ event ~ '_kitchen_tts', 'on') }}"
          push_actions: "{{ push_actions | default([]) }}"
          # Companion app push options (iOS and Android keys side by side;
          # each app ignores the other's)
          push_data: >-
            {% set push = {} %}
            {% if critical %}{% set push = dict(push, sound={'name': 'default', 'critical': 1, 'volume': 1.0}) %}{% endif %}
            {% if group %}{% set push = dict(push, **{'thread-id': group}) %}{% endif %}
            {% set d = {'push': push} if push else {} %}
            {% if critical %}{% set d = dict(d, ttl=0, priority='high', channel='alarm_stream') %}{% endif %}
            {% if push_actions %}{% set d = dict(d, actions=push_actions) %}{% endif %}
            {% if image %}{% set d = dict(d, image=image) %}{% endif %}
            {% if camera %}{% set d = dict(d, entity_id=camera) %}{% endif %}
            {% if url %}{% set d = dict(d, url=url, clickAction=url) %}{% endif %}
            {% if group %}{% set d = dict(d, group=group) %}{% endif %}
            {{ d }}

      # Record every notification (sent or held back) for the dashboards'
      # notification history - see sensor.notification_log in alerts.yaml
      - event: aird_notification
        event_data:
          event: "{{ event }}"
          title: "{{ title }}"
          message: "{{ message }}"
          critical: "{{ critical }}"
          channels: >-
            {{ (['John'] if johns_devices_on else [])
               + (['Elizabeth'] if elizabeth_on else []) + (['Kitchen'] if kitchen_tts_on else []) }}
          held: "{{ held }}"

      - if:
          - condition: template
            value_template: "{{ johns_devices_on }}"
        then:
          # mobile_app notify services (not notify.send_message) so the
          # push data can be passed through
          - action: notify.mobile_app_johns_iphone
            continue_on_error: true
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              data: "{{ push_data }}"
          - action: notify.mobile_app_johns_ipad
            continue_on_error: true
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              data: "{{ push_data }}"

      - if:
          - condition: template
            value_template: "{{ elizabeth_on }}"
        then:
          - action: notify.mobile_app_elizabeth_s_phone_xoxo
            continue_on_error: true
            data:
              title: "{{ title }}"
              message: "{{ message }}"
              data: "{{ push_data }}"

      - if:
          - condition: template
            value_template: "{{ kitchen_tts_on }}"
        then:
          - action: notify.send_message
            data:
              entity_id: notify.kitchen_kiosk_text_to_speech
              message: "{{ message }}"
