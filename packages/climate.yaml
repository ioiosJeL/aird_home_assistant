group:
  all_climates:
    name: All Climates
    entities:
      - climate.living_room
      - climate.dining_room
      - climate.kitchen
      - climate.bathroom
      - climate.sunroom
      - climate.master_bedroom
      - climate.double_bedroom
      - climate.shower_room

