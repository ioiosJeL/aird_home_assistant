script:
  climate_increment:
    alias: Increment Climate
    description: "Up the given climate"
    mode: queued
    fields:
      entity:
        description: "The entity id of the climate with domain"
        example: "climate.living_room"
      step:
        description: "The step value to change"
        example: "1"
        selector:
          number:
            min: 1
            max: 5
            step: 1
            mode: slider
    sequence:
      - action: climate.set_temperature
        target:
          entity_id: "{{ entity }}"
        data:
          temperature: "{{ (state_attr(entity, 'temperature') + step) | float }}"
      - delay: #DEBOUNCE
          milliseconds: 200

  climate_decrement:
    alias: Decrement Climate
    description: "Reduce given climate"
    mode: queued
    fields:
      entity:
        description: "The entity id of the climate with domain"
        example: "climate.living_room"
      step:
        description: "The step value to change"
        example: "1"
        selector:
          number:
            min: 1
            max: 5
            step: 1
            mode: slider
    sequence:
      - action: climate.set_temperature
        target:
          entity_id: "{{ entity }}"
        data:
          temperature: "{{ (state_attr(entity, 'temperature') - step) | float }}"
      - delay: #DEBOUNCE
          milliseconds: 200
