homeassistant:
  customize_glob:
    package.node_anchors:
      common: &common
        package: "Climate"

      thermostat_defaults: &thermostat_defaults
        platform: generic_thermostat
        precision: 0.1

      sensor_avg_defaults: &sensor_avg_defaults
        platform: min_max
        type: mean
        round_digits: 1

    sensor.*_average_temperature:
      <<: *common
      icon: mdi:thermometer

climate:
  - <<: *thermostat_defaults
    name: Living Room
    unique_id: living_room_thermostat
    heater: switch.living_room_heater
    target_sensor: sensor.living_room_average_temperature
    min_temp: 4
    max_temp: 18
    min_cycle_duration:
      seconds: 300
    away_temp: 4
    cold_tolerance: 0.4
    hot_tolerance: 0.1

  - <<: *thermostat_defaults
    name: Dining Room
    unique_id: dining_room_thermostat
    heater: switch.dining_room_heater
    target_sensor: sensor.dining_room_average_temperature
    min_temp: 10
    max_temp: 24
    min_cycle_duration:
      seconds: 600
    away_temp: 10
    cold_tolerance: 0.1
    hot_tolerance: 0.1

  - <<: *thermostat_defaults
    name: Bathroom
    unique_id: bathroom_thermostat
    heater: switch.bathroom_heater
    target_sensor: sensor.bathroom_average_temperature
    min_temp: 4
    max_temp: 22
    min_cycle_duration:
      seconds: 100
    away_temp: 8
    cold_tolerance: 0.4
    hot_tolerance: 0.1

  - <<: *thermostat_defaults
    name: Kitchen
    unique_id: kitchen_thermostat
    heater: switch.kitchen_heater
    target_sensor: sensor.kitchen_average_temperature
    min_temp: 4
    max_temp: 24
    min_cycle_duration:
      seconds: 200
    away_temp: 10
    cold_tolerance: 0.2
