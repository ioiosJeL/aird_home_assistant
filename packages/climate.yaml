    max_temp: 24
    min_cycle_duration:
      seconds: 200
    away_temp: 10
    cold_tolerance: 0.2
    hot_tolerance: 0.1

  - <<: *thermostat_defaults
    name: Double Bedroom
    unique_id: double_bedroom_thermostat
    heater: switch.double_bedroom_heater
    target_sensor: sensor.double_bedroom_average_temperature
    min_temp: 4
    max_temp: 24
    min_cycle_duration:
      seconds: 60
    away_temp: 6
    cold_tolerance: 0.4
    hot_tolerance: 0.1

  - <<: *thermostat_defaults
    name: Sunroom
    unique_id: sunroom_thermostat
    heater: switch.sunroom_heater
    target_sensor: sensor.sunroom_average_temperature
    min_temp: 0
    max_temp: 20
    min_cycle_duration:
      seconds: 100
    away_temp: 2
    cold_tolerance: 0.4
    hot_tolerance: 0.1

  - <<: *thermostat_defaults
    name: Shower Room
    unique_id: shower_room_thermostat
    heater: switch.shower_room_heater
    target_sensor: sensor.shower_room_average_temperature
    min_temp: 4
    max_temp: 18
    min_cycle_duration:
      seconds: 300
    away_temp: 6
    cold_tolerance: 0.4
    hot_tolerance: 0.1

  - <<: *thermostat_defaults
    name: Workshop
    unique_id: workshop_thermostat
