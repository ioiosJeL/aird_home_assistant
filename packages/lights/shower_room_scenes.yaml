script:
  shower_room_scene_scroll:
    alias: Shower Room Scene Progression
    description: "Scene functions & light settings"
    mode: single
    sequence:
      - action: "input_select.select_{{ 'next' if is_state('input_boolean.status_nighttime', 'on') else 'previous' }}"
        target:
          entity_id: input_select.shower_room_scenes
        data:
          cycle: true
      - action: script.turn_on
        target:
          entity_id: "script.shower_room_scene_{{ states('input_select.shower_room_scenes') | lower  }}"

  shower_room_scene_change:
    alias: Shower Room Scene Change
    description: "Scene change functions"
    mode: single
    fields:
      scene_name:
        description: "The title of the scene"
        example: "Automatic"
      scene_duration:
        description: "The duration of scene change"
        example: "5"
    sequence:
      - action: input_boolean.turn_on
        data:
          entity_id: input_boolean.shower_room_scene_changing

      - action: input_text.set_value
        data:
          entity_id: input_text.shower_room_previous_scene
          value: "{{ states('input_select.shower_room_scenes') | string }}"

      - action: input_text.set_value
        data:
          entity_id: input_text.shower_room_last_action
          value: "Scene Selected: {{ scene_name }}"

      - action: input_select.select_option
        data:
          entity_id: input_select.shower_room_scenes
          option: "{{ scene_name }}"

      - action: timer.start
        data:
          entity_id: timer.shower_room_scene_changing
          duration: "{{ scene_duration | int }}"

      - wait_template: "{{ is_state('timer.shower_room_scene_changing', 'idle') }}"

      - action: input_boolean.turn_off
        data:
          entity_id: input_boolean.shower_room_scene_changing

  shower_room_scene_bright:
    alias: Shower Room Bright Scene
    description: "Scene functions & light settings"
    mode: single
    sequence:
      - action: script.turn_on
        target:
          entity_id: script.shower_room_scene_change
        data:
          variables:
            scene_name: "Bright"
            scene_duration: 1
      - action: light.turn_on
        data:
          entity_id: light.shower_room_lights

  shower_room_scene_off:
    alias: Shower Room Off Scene
    description: "Scene functions & light settings"
    mode: single
    sequence:
      - action: script.turn_on
        target:
          entity_id: script.shower_room_scene_change
        data:
          variables:
            scene_name: "Off"
            scene_duration: 1
      - action: light.turn_off
        data:
          entity_id: light.shower_room_lights
