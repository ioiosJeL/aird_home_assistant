script:
  front_porch_scene_scroll:
    alias: Front Porch Scene Progression
    description: "Scene functions & light settings"
    mode: single
    sequence:
      - action: "input_select.select_{{ 'next' if is_state('input_boolean.status_nighttime', 'on') else 'previous' }}"
        target:
          entity_id: input_select.front_porch_scenes
        data:
          cycle: true
      - action: script.turn_on
        target:
          entity_id: "script.front_porch_scene_{{ states('input_select.front_porch_scenes') | lower  }}"

  front_porch_scene_change:
    alias: Front Porch Scene Change
    description: "Scene change functions"
    mode: restart
    fields:
      scene_name:
        description: "The title of the scene"
        example: "Automatic"
      scene_duration:
        description: "The duration of scene change"
        example: "5"
    sequence:
      - action: input_boolean.turn_on
        data:
          entity_id: input_boolean.front_porch_scene_changing

      - action: input_text.set_value
        data:
          entity_id: input_text.front_porch_previous_scene
          value: "{{ states('input_select.front_porch_scenes') | string }}"

      - action: input_text.set_value
        data:
          entity_id: input_text.front_porch_last_action
          value: "Scene Selected: {{ scene_name }}"

      - action: input_select.select_option
        data:
          entity_id: input_select.front_porch_scenes
          option: "{{ scene_name }}"

      - action: timer.start
        data:
          entity_id: timer.front_porch_scene_changing
          duration: "{{ scene_duration | int }}"

      - wait_template: "{{ is_state('timer.front_porch_scene_changing', 'idle') }}"

      - action: input_boolean.turn_off
        data:
          entity_id: input_boolean.front_porch_scene_changing

  front_porch_scene_bright:
    alias: Front Porch Bright Scene
    description: "Scene functions & light settings"
    mode: single
    sequence:
      - action: script.turn_on
        target:
          entity_id: script.front_porch_scene_change
        data:
          variables:
            scene_name: "Bright"
            scene_duration: 1
      - action: light.turn_on
        data:
          entity_id: light.front_porch

  front_porch_scene_off:
    alias: Front Porch Off Scene
    description: "Scene functions & light settings"
    mode: single
    sequence:
      - action: script.turn_on
        target:
          entity_id: script.front_porch_scene_change
        data:
          variables:
            scene_name: "Off"
            scene_duration: 1
      - action: light.turn_off
        data:
          entity_id: light.front_porch
