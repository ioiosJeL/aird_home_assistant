script:
  master_bedroom_scene_scroll:
    alias: Master Bedroom Scene Progression
    description: "Scene functions & light settings"
    mode: single
    sequence:
      - action: "input_select.select_{{ 'next' if is_state('input_boolean.status_nighttime', 'on') else 'previous' }}"
        target:
          entity_id: input_select.master_bedroom_scenes
        data:
          cycle: true
      - action: script.turn_on
        target:
          entity_id: "script.master_bedroom_scene_{{ states('input_select.master_bedroom_scenes') | lower  }}"

  master_bedroom_scene_change:
    alias: Master Bedroom Scene Change
    description: "Scene change functions"
    mode: single
    fields:
      scene_name:
        description: "The title of the scene"
        example: "Automatic"
      scene_duration:
        description: "The duration of scene change"
        example: "5"
    sequence:
      - action: input_boolean.turn_on
        data:
          entity_id: input_boolean.master_bedroom_scene_changing

      - action: input_text.set_value
        data:
          entity_id: input_text.master_bedroom_previous_scene
          value: "{{ states('input_select.master_bedroom_scenes') | string }}"

      - action: input_text.set_value
        data:
          entity_id: input_text.master_bedroom_last_action
          value: "Scene Selected: {{ scene_name }}"

      - action: input_select.select_option
        data:
          entity_id: input_select.master_bedroom_scenes
          option: "{{ scene_name }}"

      - action: timer.start
        data:
          entity_id: timer.master_bedroom_scene_changing
          duration: "{{ scene_duration | int }}"

      - wait_template: "{{ is_state('timer.master_bedroom_scene_changing', 'idle') }}"

      - action: input_boolean.turn_off
        data:
          entity_id: input_boolean.master_bedroom_scene_changing

  master_bedroom_scene_bright:
    alias: Master Bedroom Bright Scene
    description: "Scene functions beyond light settings"
    mode: single
    sequence:
      - action: script.turn_on
        target:
          entity_id: script.master_bedroom_scene_change
        data:
          variables:
            scene_name: "Bright"
            scene_duration: 3
      - action: scene.turn_on
        entity_id: scene.master_bedroom_bright
        data:
          transition: 3

  master_bedroom_scene_relax:
    alias: Master Bedroom Relax Scene
    description: "Scene functions beyond light settings"
    mode: single
    sequence:
      - action: script.turn_on
        target:
          entity_id: script.master_bedroom_scene_change
        data:
          variables:
            scene_name: "Relax"
            scene_duration: 3
      - action: scene.turn_on
        entity_id: scene.master_bedroom_sundown
        data:
          transition: 3

  master_bedroom_scene_cosy:
    alias: Master Bedroom Cosy Scene
    description: "Scene functions & light settings"
    mode: single
    sequence:
      - action: script.turn_on
        target:
          entity_id: script.master_bedroom_scene_change
        data:
          variables:
            scene_name: "Cosy"
            scene_duration: 5
      - action: scene.turn_on
        entity_id: scene.master_bedroom_starlight
        data:
          transition: 5

  master_bedroom_scene_special:
    alias: Master Bedroom Special Scene
    description: "Scene functions & light settings"
    mode: single
    sequence:
      - action: script.turn_on
        target:
          entity_id: script.master_bedroom_scene_change
        data:
          variables:
            scene_name: "Special"
            scene_duration: 30
      - action: scene.turn_on
        entity_id: scene.master_bedroom_ruby_romance
        data:
          transition: 30

  master_bedroom_scene_quickly_off:
    alias: Master Bedroom Off Scene Quickly
    description: "Scene functions & light settings"
    mode: single
    sequence:
      - action: script.turn_on
        target:
          entity_id: script.master_bedroom_scene_change
        data:
          variables:
            scene_name: "Off"
            scene_duration: 1
      - action: light.turn_on
        data:
          entity_id: light.master_bedroom_ceiling_light
          brightness: 0
          transition: 1
      - action: light.turn_on
        data:
          entity_id: light.master_bedroom_lamps
          brightness: 0
          transition: 1

  master_bedroom_scene_off:
    alias: Master Bedroom Off Scene
    description: "Scene functions & light settings"
    mode: single
    sequence:
      - action: script.turn_on
        target:
          entity_id: script.master_bedroom_scene_change
        data:
          variables:
            scene_name: "Off"
            scene_duration: 3
      - action: light.turn_on
        data:
          entity_id: light.master_bedroom_ceiling_light
          brightness: 0
          transition: 1
      - action: light.turn_on
        data:
          entity_id: light.master_bedroom_lamps
          brightness: 0
          transition: 3
