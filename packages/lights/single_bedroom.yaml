homeassistant:
  customize_glob:
    package.node_anchors:
      double: &double
        package: "Lights"
        room: "Single Bedroom"

    input_number.single_bedroom_lights_*:
      <<: *double
    light.single_bedroom_*:
      <<: *double
    timer.single_bedroom_scene_*:
      <<: *double
    sensor.single_bedroom_*_warmth:
      <<: *double
    sensor.single_bedroom_*_brightness:
      <<: *double

  customize:
    input_select.single_bedroom_scenes:
      <<: *double
    input_text.single_bedroom_last_action:
      <<: *double
    input_text.single_bedroom_previous_scene:
      <<: *double
    input_boolean.single_bedroom_scene_changing:
      <<: *double
    sensor.single_bedroom_active_light_count:
      <<: *double

input_select:
  # All scenes
  single_bedroom_scenes:
    name: Single Bedroom Scenes
    options:
      - "Bright"
      - "Relax"
      - "Cosy"
      - "Off"
    icon: mdi:palette-outline

input_text:
  # The last action performed
  single_bedroom_last_action:
    name: "Last Action: Single Bedroom"
    icon: mdi:gesture-tap-button
    initial: "None: Boot"

  # Previous scene before current
  single_bedroom_previous_scene:
    name: Previous Single Bedroom Scene
    icon: mdi:palette
    initial: "Reboot"

input_number:
  # Lux level below which brings on the auto lights
  single_bedroom_lights_on_threshold:
    name: Single Bedroom Threshold On
    min: 1
    max: 70

light:
  # All lights
  - platform: group
    name: Single Bedroom Lights Master
    entities:
      - light.single_bedroom_wall

input_boolean:
  # On when the lights were changed outside HA (e.g. Hue app); motion
  # leaves the room alone until it clears (see Manual Override Detection)
  single_bedroom_manual_override:
    name: Single Bedroom Manual Override
    icon: mdi:hand-back-right

  # Boolean which is on during scene change
  single_bedroom_scene_changing:
    name: Single Bedroom Scene Change In Progress
    icon: mdi:repeat-once
    initial: false

  # Boolean which is on when lights are in auto mode
  single_bedroom_auto_mode_active:
    name: Single Bedroom Auto Mode
    icon: mdi:refresh-auto

  # Auto mode active
  single_bedroom_automatic_lights:
    name: Single Bedroom Automatic Lights Mode
    icon: mdi:refresh-auto

timer:
  # Running after the lights went (or nearly went) off on someone who was
  # still here; the motion timeout is doubled while it runs
  single_bedroom_motion_extended:
    name: Single Bedroom Motion Timeout Extended
    icon: mdi:timer-plus-outline
    duration: "00:30:00"

  # Timer set during each scene on script for transitions
  single_bedroom_scene_changing:
    name: Time For Scene Change
    icon: mdi:timer-sand-empty

  # Timer to prevent lights from waiting for light sensor to update
  single_bedroom_auto_off_override:
    name: Timer To Prevent Waiting For Lux Sensor
    icon: mdi:timer-sand-empty

template:
  - sensor:
      # Determine if any lights in any group is currently on
      - default_entity_id: sensor.single_bedroom_active_light_count
        name: "Single Bedroom Active Light Count"
        unit_of_measurement: Lights
        state: >-
          {{ expand('light.single_bedroom_lights_master') | selectattr('state', 'ne', 'off') | list | count }}

automation:
  - alias: Single Bedroom Lights Manual Override Detection
    use_blueprint:
      path: lights/manual_override_detection.yaml
      input:
        lights:
          - light.single_bedroom_wall
        lights_master: light.single_bedroom_lights_master
        manual_boolean: input_boolean.single_bedroom_manual_override
        scene_changing_boolean: input_boolean.single_bedroom_scene_changing
        scenes_select: input_select.single_bedroom_scenes
        auto_mode_boolean: input_boolean.single_bedroom_auto_mode_active
        last_action_text: input_text.single_bedroom_last_action

  - alias: Single Bedroom Lights Auto On
    use_blueprint:
      path: lights/motion_auto_on.yaml
      input:
        previous_scene_text: input_text.single_bedroom_previous_scene
        room_prefix: single_bedroom
        extend_timer: timer.single_bedroom_motion_extended
        manual_override_boolean: input_boolean.single_bedroom_manual_override
        motion_sensor: binary_sensor.single_bedroom_motion
        automatic_lights_boolean: input_boolean.single_bedroom_automatic_lights
        scenes_select: input_select.single_bedroom_scenes
        illuminance_sensor: sensor.hms_single_bedroom_illuminance
        threshold_number: input_number.single_bedroom_lights_on_threshold
        override_timer: timer.single_bedroom_auto_off_override
        last_action_text: input_text.single_bedroom_last_action
        auto_mode_boolean: input_boolean.single_bedroom_auto_mode_active
        daytime_script: script.single_bedroom_scene_bright
        nighttime_script: script.single_bedroom_scene_relax
        bedtime_boolean: input_boolean.status_bedtime_single

  - alias: Single Bedroom Lights Auto Off
    use_blueprint:
      path: lights/motion_auto_off.yaml
      input:
        extend_timer: timer.single_bedroom_motion_extended
        warning_lights:
          - light.single_bedroom_wall
        motion_sensor: binary_sensor.single_bedroom_motion
        motion_timeout_number: input_number.single_bedroom_motion_timeout
        automatic_lights_boolean: input_boolean.single_bedroom_automatic_lights
        auto_mode_boolean: input_boolean.single_bedroom_auto_mode_active
        off_script: script.single_bedroom_scene_off
        last_action_text: input_text.single_bedroom_last_action
        override_timer: timer.single_bedroom_auto_off_override

  # Night Mode + room quiet for its motion timeout = gone to bed: set
  # bedtime so moving in bed doesn't bring the lights on. Auto-off still
  # works. Cleared by End Night Mode (core.yaml).
  - alias: Single Bedroom Bedtime After Quiet
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.single_bedroom_motion
        to: "off"
        for:
          minutes: "{{ states('input_number.single_bedroom_motion_timeout') | int }}"
    conditions:
      - condition: state
        entity_id: input_boolean.status_nighttime
        state: "on"
    actions:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.status_bedtime_single

  - alias: Single Bedroom Lights Manual Off Detection
    use_blueprint:
      path: lights/manual_off_detection.yaml
      input:
        manual_override_boolean: input_boolean.single_bedroom_manual_override
        lights_master: light.single_bedroom_lights_master
        scenes_select: input_select.single_bedroom_scenes
        off_script: script.single_bedroom_scene_off
        last_action_text: input_text.single_bedroom_last_action
        auto_mode_boolean: input_boolean.single_bedroom_auto_mode_active

  - alias: Single Bedroom Scene Select Changed
    use_blueprint:
      path: lights/scene_select_changed.yaml
      input:
        scenes_select: input_select.single_bedroom_scenes
        scene_changing_boolean: input_boolean.single_bedroom_scene_changing
        room_prefix: single_bedroom
