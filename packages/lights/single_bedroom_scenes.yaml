script:
  single_bedroom_scene_scroll:
    alias: Single Bedroom Scene Progression
    description: "Scene functions & light settings"
    mode: single
    sequence:
      - action: "input_select.select_{{ 'next' if is_state('input_boolean.status_nighttime', 'on') else 'previous' }}"
        target:
          entity_id: input_select.single_bedroom_scenes
        data:
          cycle: true
      - action: script.turn_on
        target:
          entity_id: "script.single_bedroom_scene_{{ states('input_select.single_bedroom_scenes') | lower  }}"

  single_bedroom_scene_change:
    alias: Single Bedroom Scene Change
    description: "Scene change functions"
    mode: single
    fields:
      scene_name:
        description: "The title of the scene"
        example: "Automatic"
      scene_duration:
        description: "The duration of scene change"
        example: "5"
    sequence:
      - action: input_boolean.turn_on
        data:
          entity_id: input_boolean.single_bedroom_scene_changing

      - action: input_text.set_value
        data:
          entity_id: input_text.single_bedroom_previous_scene
          value: "{{ states('input_select.single_bedroom_scenes') | string }}"

      - action: input_text.set_value
        data:
          entity_id: input_text.single_bedroom_last_action
          value: "Scene Selected: {{ scene_name }}"

      - action: input_select.select_option
        data:
          entity_id: input_select.single_bedroom_scenes
          option: "{{ scene_name }}"

      - action: timer.start
        data:
          entity_id: timer.single_bedroom_scene_changing
          duration: "{{ scene_duration | int }}"

      - wait_template: "{{ is_state('timer.single_bedroom_scene_changing', 'idle') }}"

      - action: input_boolean.turn_off
        data:
          entity_id: input_boolean.single_bedroom_scene_changing

  single_bedroom_scene_bright:
    alias: Single Bedroom Bright Scene Extras
    description: "Scene functions beyond light settings"
    mode: single
    sequence:
      - action: script.turn_on
        target:
          entity_id: script.single_bedroom_scene_change
        data:
          variables:
            scene_name: "Bright"
            scene_duration: 3
      - action: light.turn_on
        data:
          entity_id: light.single_bedroom_wall
          brightness: 255
          transition: 3

  single_bedroom_scene_relax:
    alias: Single Bedroom Relax Scene Extras
    description: "Scene functions beyond light settings"
    mode: single
    sequence:
      - action: script.turn_on
        target:
          entity_id: script.single_bedroom_scene_change
        data:
          variables:
            scene_name: "Relax"
            scene_duration: 5
      - action: light.turn_on
        data:
          entity_id: light.single_bedroom_wall
          brightness: 140
          transition: 5

  single_bedroom_scene_cosy:
    alias: Single Bedroom Cosy Scene Extras
    description: "Scene functions & light settings"
    mode: single
    sequence:
      - action: script.turn_on
        target:
          entity_id: script.single_bedroom_scene_change
        data:
          variables:
            scene_name: "Cosy"
            scene_duration: 5
      - action: light.turn_on
        data:
          entity_id: light.single_bedroom_wall
          brightness: 70
          transition: 5

  single_bedroom_scene_quickly_off:
    alias: Single Bedroom Off Scene Quickly
    description: "Scene functions & light settings"
    mode: single
    sequence:
      - action: script.turn_on
        target:
          entity_id: script.single_bedroom_scene_change
        data:
          variables:
            scene_name: "Off"
            scene_duration: 2
      - action: light.turn_on
        data:
          entity_id: light.single_bedroom_wall
          brightness: 0
          transition: 2

  single_bedroom_scene_off:
    alias: Single Bedroom Off Scene
    description: "Scene functions & light settings"
    mode: single
    sequence:
      - action: script.turn_on
        target:
          entity_id: script.single_bedroom_scene_change
        data:
          variables:
            scene_name: "Off"
            scene_duration: 1
      - action: light.turn_on
        data:
          entity_id: light.single_bedroom_wall
          brightness: 0
          transition: 1
