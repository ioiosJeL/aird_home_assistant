homeassistant:
  customize_glob:
    package.node_anchors:
      double: &double
        package: "Lights"
        room: "Living Room"

    input_number.living_room_lights_*:
      <<: *double
    light.living_room_*:
      <<: *double
    timer.living_room_scene_*:
      <<: *double
    sensor.living_room_*_warmth:
      <<: *double
    sensor.living_room_*_brightness:
      <<: *double

  customize:
    input_select.living_room_scenes:
      <<: *double
    input_text.living_room_last_action:
      <<: *double
    input_text.living_room_previous_scene:
      <<: *double
    input_boolean.living_room_scene_changing:
      <<: *double
    sensor.living_room_active_light_count:
      <<: *double

input_select:
  # All scenes
  living_room_scenes:
    name: Living Room Scenes
    options:
      - "Bright"
      - "Relax"
      - "Cosy"
      - "Movie"
      - "Off"
    icon: mdi:palette-outline

input_text:
  # The last action performed
  living_room_last_action:
    name: "Last Action: Living Room"
    icon: mdi:gesture-tap-button
    initial: "None: Boot"

  # Previous scene before current
  living_room_previous_scene:
    name: Previous Living Room Scene
    icon: mdi:palette
    initial: "Reboot"

input_number:
  # Lux level below which brings on the auto lights
  living_room_lights_on_threshold:
    name: Living Room Threshold On
    min: 1
    max: 70

light:
  - platform: group
    name: Living Room Lamps
    entities:
      - light.living_room_lamp

  - platform: group
    name: Living Room Lights Master
    entities:
      - light.living_room_dimmer
      - light.living_room_lamp

input_boolean:
  # On when the lights were changed outside HA (e.g. Hue app); motion
  # leaves the room alone until it clears (see Manual Override Detection)
  living_room_manual_override:
    name: Living Room Manual Override
    icon: mdi:hand-back-right

  # Boolean which is on during scene change
  living_room_scene_changing:
    name: Living Room Scene Change In Progress
    icon: mdi:repeat-once
    initial: false

  # Boolean which is on when lights are in auto mode
  living_room_auto_mode_active:
    name: Living Room Auto Mode
    icon: mdi:refresh-auto

  # Auto mode active
  living_room_automatic_lights:
    name: Living Room Automatic Lights Mode
    icon: mdi:refresh-auto

timer:
  # Running after the lights went (or nearly went) off on someone who was
  # still here; the motion timeout is doubled while it runs
  living_room_motion_extended:
    name: Living Room Motion Timeout Extended
    icon: mdi:timer-plus-outline
    duration: "00:30:00"

  # Timer set during each scene on script for transitions
  living_room_scene_changing:
    name: Time For Scene Change
    icon: mdi:timer-sand-empty

  # Timer to prevent lights from waiting for light sensor to update
  living_room_auto_off_override:
    name: Timer To Prevent Waiting For Lux Sensor
    icon: mdi:timer-sand-empty

template:
  - sensor:
      # Determine if any lights in any group is currently on
      - default_entity_id: sensor.living_room_active_light_count
        name: "Living Room Active Light Count"
        unit_of_measurement: Lights
        state: >-
          {{ expand('light.living_room_lights_master') | selectattr('state', 'ne', 'off') | list | count }}

automation:
  - alias: Living Room Lights Manual Override Detection
    use_blueprint:
      path: lights/manual_override_detection.yaml
      input:
        lights:
          - light.living_room_lamp
        lights_master: light.living_room_lights_master
        manual_boolean: input_boolean.living_room_manual_override
        scene_changing_boolean: input_boolean.living_room_scene_changing
        scenes_select: input_select.living_room_scenes
        auto_mode_boolean: input_boolean.living_room_auto_mode_active
        last_action_text: input_text.living_room_last_action

  - alias: Living Room Lights Auto On
    use_blueprint:
      path: lights/motion_auto_on.yaml
      input:
        previous_scene_text: input_text.living_room_previous_scene
        room_prefix: living_room
        extend_timer: timer.living_room_motion_extended
        manual_override_boolean: input_boolean.living_room_manual_override
        motion_sensor: binary_sensor.living_room_motion
        automatic_lights_boolean: input_boolean.living_room_automatic_lights
        scenes_select: input_select.living_room_scenes
        illuminance_sensor: sensor.hms_living_room_illuminance
        threshold_number: input_number.living_room_lights_on_threshold
        override_timer: timer.living_room_auto_off_override
        last_action_text: input_text.living_room_last_action
        auto_mode_boolean: input_boolean.living_room_auto_mode_active
        daytime_script: script.living_room_scene_bright
        nighttime_script: script.living_room_scene_relax

  - alias: Living Room Lights Auto Off
    use_blueprint:
      path: lights/motion_auto_off.yaml
      input:
        # Early off (17 Nov 2026): once it's quiet here and someone moves in
        # another room, switch off after 10 min instead of the full timeout
        early_minutes: 10
        elsewhere_motion:
          - binary_sensor.bathroom_motion
          - binary_sensor.dining_room_motion
          - binary_sensor.double_bedroom_motion
          - binary_sensor.hall_motion
          - binary_sensor.kitchen_motion
          - binary_sensor.landing_motion
          - binary_sensor.master_bedroom_motion
          - binary_sensor.shower_room_motion
          - binary_sensor.single_bedroom_motion
          - binary_sensor.sunroom_motion
          - binary_sensor.utility_room_motion
        extend_timer: timer.living_room_motion_extended
        warning_lights:
          - light.living_room_dimmer
          - light.living_room_lamp
        motion_sensor: binary_sensor.living_room_motion
        motion_timeout_number: input_number.living_room_motion_timeout
        automatic_lights_boolean: input_boolean.living_room_automatic_lights
        auto_mode_boolean: input_boolean.living_room_auto_mode_active
        off_script: script.living_room_scene_off
        last_action_text: input_text.living_room_last_action
        override_timer: timer.living_room_auto_off_override

  - alias: Living Room Lights Manual Off Detection
    use_blueprint:
      path: lights/manual_off_detection.yaml
      input:
        manual_override_boolean: input_boolean.living_room_manual_override
        lights_master: light.living_room_lights_master
        scenes_select: input_select.living_room_scenes
        off_script: script.living_room_scene_off
        last_action_text: input_text.living_room_last_action
        auto_mode_boolean: input_boolean.living_room_auto_mode_active

  - alias: Living Room Scene Select Changed
    use_blueprint:
      path: lights/scene_select_changed.yaml
      input:
        scenes_select: input_select.living_room_scenes
        scene_changing_boolean: input_boolean.living_room_scene_changing
        room_prefix: living_room

  - alias: Living Room Light Toggle
    use_blueprint:
      path: lights/physical_toggle.yaml
      input:
        trigger:
          - trigger: event
            event_type: shelly.click
            event_data:
              click_type: single
              device: shellydimmer-F3ED36
              channel: 1
          - trigger: event
            event_type: hue_event
            event_data:
              type: short_release
              id: hds_living_room_button
              subtype: 1
          - trigger: event
            event_type: hue_event
            event_data:
              type: short_release
              id: hds_living_room_button
              subtype: 4
        changing_timer: timer.living_room_scene_changing
        scenes_select: input_select.living_room_scenes
        on_script: script.living_room_scene_bright
        off_script: script.living_room_scene_quickly_off
        auto_mode_boolean: input_boolean.living_room_auto_mode_active

  - alias: Living Room Scene Scroll
    use_blueprint:
      path: lights/scene_scroll.yaml
      input:
        trigger:
          - trigger: event
            event_type: shelly.click
            event_data:
              click_type: long
              device: shellydimmer-F3ED36
              channel: 1
          - trigger: event
            event_type: hue_event
            event_data:
              type: long_release
              id: hds_living_room_button
              subtype: 1
          - trigger: event
            event_type: hue_event
            event_data:
              type: long_release
              id: hds_living_room_button
              subtype: 4
        changing_timer: timer.living_room_scene_changing
        scroll_script: script.living_room_scene_scroll
        auto_mode_boolean: input_boolean.living_room_auto_mode_active
