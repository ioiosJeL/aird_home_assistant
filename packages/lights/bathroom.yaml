homeassistant:
  customize_glob:
    package.node_anchors:
      zoned: &zoned
        package: "Lights"
        zone: "Bathroom"

  customize:
    input_select.bathroom_scenes:
      <<: *zoned
    input_text.bathroom_last_action:
      <<: *zoned
    input_text.bathroom_previous_scene:
      <<: *zoned
    automation.bathroom_lights_auto_on:
      <<: *zoned
    automation.bathroom_lights_auto_off:
      <<: *zoned

input_select:
  # All Scenes
  bathroom_scenes:
    name: Bathroom Scenes
    options:
      - "Bright"
      - "Relax"
      - "Cosy"
      - "Off"

light:
  - platform: group
    name: Bathroom Lights Master
    entities:
      - light.bathroom_dimmer

input_text:
  # The last action performed
  bathroom_last_action:
    name: "Last Action: Bathroom"
    icon: mdi:gesture-tap-button
    initial: "None: Boot"

  # Previous scene before current
  bathroom_previous_scene:
    name: Previous Bathroom Scene
    icon: mdi:palette
    initial: "Reboot"

input_number:
  # Lux level below which brings on the auto lights
  bathroom_lights_on_threshold:
    name: Bathroom Threshold On
    min: 1
    max: 70

input_boolean:
  # Boolean which is on during scene change
  bathroom_scene_changing:
    name: Bathroom Scene Change In Progress
    icon: mdi:repeat-once
    initial: false

  # Boolean which is on when lights are in auto mode
  bathroom_auto_mode_active:
    name: Bathroom Auto Mode
    icon: mdi:refresh-auto

  # Auto mode active
  bathroom_automatic_lights:
    name: Bathroom Automatic Lights Mode
    icon: mdi:refresh-auto

timer:
  # Running after the lights went (or nearly went) off on someone who was
  # still here; the motion timeout is doubled while it runs
  bathroom_motion_extended:
    name: Bathroom Motion Timeout Extended
    icon: mdi:timer-plus-outline
    duration: "00:30:00"

  # Timer set during each scene on script for transitions
  bathroom_scene_changing:
    name: Time For Scene Change
    icon: mdi:timer-sand-empty

  # Timer to prevent lights from waiting for light sensor to update
  bathroom_auto_off_override:
    name: Timer To Prevent Waiting For Lux Sensor
    icon: mdi:timer-sand-empty

automation:
  - alias: Bathroom Lights Auto On
    use_blueprint:
      path: lights/motion_auto_on.yaml
      input:
        previous_scene_text: input_text.bathroom_previous_scene
        room_prefix: bathroom
        extend_timer: timer.bathroom_motion_extended
        motion_sensor: binary_sensor.bathroom_motion
        automatic_lights_boolean: input_boolean.bathroom_automatic_lights
        scenes_select: input_select.bathroom_scenes
        illuminance_sensor: sensor.hms_bathroom_illuminance
        threshold_number: input_number.bathroom_lights_on_threshold
        override_timer: timer.bathroom_auto_off_override
        last_action_text: input_text.bathroom_last_action
        auto_mode_boolean: input_boolean.bathroom_auto_mode_active
        daytime_script: script.bathroom_scene_bright
        nighttime_script: script.bathroom_scene_cosy
        # While Night Mode is on: straight on at 10%, no bright scene first
        late_night_lights: [light.bathroom_dimmer]
        late_night_brightness: 10
        late_night_change_script: script.bathroom_scene_change
        late_night_scene_name: Cosy

  - alias: Bathroom Lights Auto Off
    use_blueprint:
      path: lights/motion_auto_off.yaml
      input:
        # Don't time out on someone in the shower/bath
        extra_condition: "{{ not is_state('binary_sensor.bathroom_bathing', 'on') }}"
        extend_timer: timer.bathroom_motion_extended
        warning_lights:
          - light.bathroom_dimmer
        motion_sensor: binary_sensor.bathroom_motion
        motion_timeout_number: input_number.bathroom_motion_timeout
        automatic_lights_boolean: input_boolean.bathroom_automatic_lights
        auto_mode_boolean: input_boolean.bathroom_auto_mode_active
        off_script: script.bathroom_scene_off
        last_action_text: input_text.bathroom_last_action
        override_timer: timer.bathroom_auto_off_override

  - alias: Bathroom Lights Manual Off Detection
    use_blueprint:
      path: lights/manual_off_detection.yaml
      input:
        lights_master: light.bathroom_lights_master
        scenes_select: input_select.bathroom_scenes
        off_script: script.bathroom_scene_off
        last_action_text: input_text.bathroom_last_action
        auto_mode_boolean: input_boolean.bathroom_auto_mode_active

  - alias: Bathroom Scene Select Changed
    use_blueprint:
      path: lights/scene_select_changed.yaml
      input:
        scenes_select: input_select.bathroom_scenes
        scene_changing_boolean: input_boolean.bathroom_scene_changing
        room_prefix: bathroom

  - alias: Bathroom Light Toggle
    use_blueprint:
      path: lights/physical_toggle.yaml
      input:
        trigger:
          - trigger: event
            event_type: shelly.click
            event_data:
              click_type: single
              device: shellydimmer2-C45BBE792A62
              channel: 2
        changing_timer: timer.bathroom_scene_changing
        scenes_select: input_select.bathroom_scenes
        on_script: script.bathroom_scene_bright
        off_script: script.bathroom_scene_off
        auto_mode_boolean: input_boolean.bathroom_auto_mode_active

  - alias: Bathroom Scene Scroll
    use_blueprint:
      path: lights/scene_scroll.yaml
      input:
        trigger:
          - trigger: event
            event_type: shelly.click
            event_data:
              click_type: long
              device: shellydimmer2-C45BBE792A62
              channel: 2
        changing_timer: timer.bathroom_scene_changing
        scroll_script: script.bathroom_scene_scroll
        auto_mode_boolean: input_boolean.bathroom_auto_mode_active
