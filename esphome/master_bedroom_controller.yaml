substitutions:
  # UNIQUE NAME FOR THE DEVICE
  deviceName: master_bedroom_controller
  deviceUpper: Master Bedroom Controller
  
  ipAddress: 192.168.40.13

  # NAME OF WLED MATRIX IN HA
  matrixWLED: master_bedroom_matrix

  # WIFI AND OTHER CREDENTIALS. USE SECRETS WHERE POSSIBLE
  wifiPass: !secret wifiPassESP
  wifiSSID: !secret wifiSSIDESP
  passOTA: !secret passOTA
  
  # ESP DECLARATION
  boardPlatform: ESP8266
  boardName: d1_mini
  
  # PIN MAPPING. DEFAULTS TO ioios.io PITHY AND COUNTER DEVICES
  encoderPinA: D5
  encoderPinB: D6
  encoderSwitch: D7
  i2cData: D4
  i2cClock: D3
  pirSensor: D0
  sideSwitch: D1

  
###############################################################################
# WHOA WHERE ARE YOU GOING? GO STEADY BEYOND HERE, THIS IS THE BREAKABLE BIT! #
###############################################################################

esphome:
  name: ${deviceName}  
  friendly_name: ${deviceUpper}

esp8266:
  board: ${boardName}

wifi:
  ssid: ${wifiSSID}
  password: ${wifiPass}
  fast_connect: true
  power_save_mode: none
  manual_ip:
    static_ip: ${ipAddress}
    gateway: 192.168.40.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1

captive_portal:
logger:
ota:
  platform: esphome
  password: ${passOTA}

i2c:
  sda: ${i2cData}
  scl: ${i2cClock}
  scan: true
  id: bus_a

time:
  - platform: homeassistant
    id: homeassistant_time

api:
  encryption:
    key: !secret api_key_master_bedroom_controller

font:
  - file: "fonts/LiberationSans-Bold.ttf"
    id: tiny_font
    size: 10
    glyphs: ":/&!°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz ."
  - file: "fonts/LiberationSans-Bold.ttf"
    id: small_font
    size: 15
    glyphs: ":/&!°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz ."


image:
  - file: "images/return.png"
    id: return_image
    resize: 48x48
  - file: "images/tick.png"
    id: tick_image
    resize: 16x16
  - file: "images/off.png"
    id: off_image
    resize: 16x16

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    address: 0x3C
    update_interval: 0.7s
    id: i2cDisplay
    pages:
      - id: mainPage
        lambda: |-
          if(id(matrix_power).state == 0) {
            it.printf(125, 46, id(small_font), TextAlign::TOP_RIGHT, "%s", id(wifi_percent).state.c_str());
            it.printf(0, 50, id(tiny_font), TextAlign::TOP_LEFT, "%s", id(ip_add).state.c_str());
          } else {
            if(id(playlist).state == "unknown") {
              it.printf(64, 0, id(tiny_font), TextAlign::TOP_CENTER, "Preset");
            } else {
              it.printf(64, 0, id(tiny_font), TextAlign::TOP_CENTER, "%s", id(playlist).state.c_str());
            }
            it.printf(64, 16, id(small_font), TextAlign::TOP_CENTER, "%s", id(preset).state.c_str());
            it.printf(125, 46, id(small_font), TextAlign::TOP_RIGHT, "%s", id(wifi_percent).state.c_str());
            it.printf(0, 50, id(tiny_font), TextAlign::TOP_LEFT, "%s", id(ip_add).state.c_str());
          }

      - id: pageReturning
        lambda: |-
          it.image(48, 16, id(return_image));
          it.printf(64, 0, id(small_font), TextAlign::TOP_CENTER, "RETURNING");
          
globals:
  - id: menu_tracker
    type: int
    initial_value: '0'  

  - id: matrix_mode
    type: std::string
    restore_value: no

  - id: lastAct
    type: int
    initial_value: '0'
    
  - id: uptimeSecs
    type: int
    initial_value: '0'
    
  - id: oneShot
    type: int
    initial_value: '0'
    
  - id: ignoreAction
    type: int
    initial_value: '0'
                
switch:
  - platform: restart
    name: "ESP Restart"

text_sensor:

  - platform: homeassistant
    id: wifi_percent
    entity_id: sensor.${matrixWLED}_wi_fi_signal
    internal: true

  - platform: homeassistant
    id: ip_add
    entity_id: sensor.${matrixWLED}_ip
    internal: true

  - platform: homeassistant
    id: playlist
    entity_id: select.${matrixWLED}_playlist
    internal: true
  - platform: homeassistant
    id: preset
    entity_id: select.${matrixWLED}_preset
    internal: true
    on_value: 
      then:
        - display.page.show: "mainPage"

sensor:
  - platform: wifi_signal
    name: ESP Signal
    filters:
      - or:
          - throttle: 600s
          - delta: 5.0
    update_interval: 10s

  - platform: uptime
    name: ESP Uptime
    update_interval: 60s
            
  - platform: rotary_encoder
    id: rotary_dial
    pin_a:
      number: ${encoderPinA}
      inverted: true
      mode: INPUT_PULLUP
    pin_b:
      number: ${encoderPinB}
      inverted: true
      mode: INPUT_PULLUP
    on_clockwise:
      - logger.log: "Turned Clockwise"
      - homeassistant.service:
          service: select.select_next
          data:
            entity_id: select.${matrixWLED}_preset
    on_anticlockwise:
      - logger.log: "Turned Anticlockwise"
      - homeassistant.service:
          service: select.select_previous
          data:
            entity_id: select.${matrixWLED}_preset

binary_sensor:
  - platform: homeassistant
    id: matrix_power
    entity_id: light.${matrixWLED}_main
    internal: true

  - platform: gpio
    pin:
      number: ${encoderSwitch}
      inverted: true
      mode: INPUT_PULLUP
    name: Menu ${deviceUpper}
    internal: true
    on_multi_click:
    - timing:
      - ON for at most 0.7s
      - OFF for at most 0.7s
      - ON for at most 0.7s
      - OFF for at least 0.2s
      then:
        - logger.log: "Double Click"
        - homeassistant.service:
            service: select.select_previous
            data_template:
                entity_id: select.${matrixWLED}_playlist
    - timing:
      - ON for 1.2s to 3s
      - OFF for at least 0.1s
      then:
        - logger.log: "Long Click"
        - homeassistant.service:
            service: light.toggle
            data_template:
              entity_id: light.${matrixWLED}_main
    - timing:
      - ON for at most 0.7s
      - OFF for at least 0.4s
      then:
        - logger.log: "Single Click"
        - homeassistant.service:
            service: select.select_next
            data_template:
                entity_id: select.${matrixWLED}_playlist