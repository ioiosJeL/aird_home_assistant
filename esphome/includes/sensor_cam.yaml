esphome:
  name: ${deviceName}
  friendly_name: ${deviceUpper}

esp32:
  board: ${boardName}
  framework:
    type: esp-idf

wifi:
  ssid: ${wifiSSID}
  password: ${wifiPass}
  fast_connect: true
  power_save_mode: none
  manual_ip:
    static_ip: ${ipAddress}
    gateway: 192.168.40.1
    subnet: 255.255.255.0
    dns1: 192.168.1.1

captive_portal:
logger:
ota:
  platform: esphome
  password: ${passOTA}

i2c:
  - id: stdi2c
    sda: ${i2cData}
    scl: ${i2cClock}
    scan: True

  - id: camera_i2c
    sda: GPIO26
    scl: GPIO27

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key_includes_sensor_cam

switch:
  - platform: restart
    name: "ESP Restart"

  - platform: homeassistant
    id: machine_room_light
    entity_id: light.machine_room_light

sensor:
  - platform: wifi_signal
    name: ESP Signal
    filters:
      - or:
          - throttle: 600s
          - delta: 5.0
    update_interval: 30s

  - platform: uptime
    name: ESP Uptime
    update_interval: 60s

  - platform: sht3xd
    i2c_id: stdi2c
    temperature:
      name: "Temperature"
      accuracy_decimals: 1
      id: ${deviceName}_temperature
      filters:
        - or:
            - throttle: 300s
            - delta: 0.1
    humidity:
      name: "Humidity"
      accuracy_decimals: 0
      id: ${deviceName}_humidity
      filters:
        - or:
            - throttle: 600s
            - delta: 1.0
    address: 0x44
    update_interval: 5s

binary_sensor:
  - platform: gpio
    pin:
      number: ${pirPin}
      mode:
        input: true
        pulldown: true
    name: "Motion"
    device_class: motion
    
psram:
esp32_camera:
  external_clock:
    pin: GPIO0
    frequency: 8MHz
  i2c_id: camera_i2c
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  wb_mode: office
  # Image settings
  name: Camera
  vertical_flip: False
  horizontal_mirror: False
  brightness: 0
  ae_level: 2
  max_framerate: 4 fps
  idle_framerate: 0.05 fps
  on_stream_start:
    then:
      - switch.turn_on: machine_room_light
  on_stream_stop:
    then:
      - switch.turn_off: machine_room_light
