substitutions:
  deviceName: garage_east_sensor
  deviceUpper: Garage East Sensor
  ipAddress: 192.168.40.10

  # WIFI AND OTHER CREDENTIALS. USE SECRETS WHERE POSSIBLE
  wifiPass: !secret wifiPassESP
  wifiSSID: !secret wifiSSIDESP
  passOTA: !secret passOTA
  
  # ESP DECLARATION
  boardPlatform: ESP8266
  boardName: d1_mini
  
  # PIN MAPPING.
  i2cData: D3
  i2cClock: D4
  pirPin: D0

<<: !include includes/sensor_8266.yaml

# SHT3x here fails at the shared 800kHz (scan finds 0x44 but reads/writes
# fail), so run this node's bus at the standard 100kHz.
i2c:
  sda: ${i2cData}
  scl: ${i2cClock}
  scan: True
  frequency: 100kHz
  id: bus_a
