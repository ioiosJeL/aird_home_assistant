substitutions:
  deviceName: master_bedroom_pixel
  deviceUpper: Master Bedroom Pixel

  # WIFI AND OTHER CREDENTIALS. USE SECRETS WHERE POSSIBLE
  wifiPass: !secret wifiPassESP
  wifiSSID: !secret wifiSSIDESP
  passOTA: !secret passOTA
  
  # ESP DECLARATION
  boardPlatform: ESP8266
  boardName: d1_mini
  
  # PIN MAPPING.
  i2cData: D3
  i2cClock: D4
  neoPixels: RX
  
###############################################################################
# WHOA WHERE ARE YOU GOING? GO STEADY BEYOND HERE, THIS IS THE BREAKABLE BIT! #
###############################################################################

esphome:
  name: ${deviceName}
  friendly_name: ${deviceUpper}

esp8266:
  board: ${boardName}

wifi:
  ssid: ${wifiSSID}
  password: ${wifiPass}
  fast_connect: true
  
captive_portal:
logger:
ota:
  platform: esphome
  password: ${passOTA}
  
i2c:
  sda: ${i2cData}
  scl: ${i2cClock}
  scan: True
  frequency: 800kHz
  id: bus_a

time:
  - platform: homeassistant
    id: homeassistant_time
    
# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key_master_bedroom_pixel

switch:
  - platform: restart
    name: "ESP Restart"
    
sensor:
  - platform: wifi_signal
    name: ESP Signal
    filters:
      - or:
          - throttle: 600s
          - delta: 5.0
    update_interval: 10s

  - platform: uptime
    name: ESP Uptime
    update_interval: 60s
    
wled:
light:
  - platform: neopixelbus
    type: GRB
    variant: WS2813
    pin: ${neoPixels}
    num_leds: 16
    id: ${deviceName}_neopixel
    name: "Ring"
    effects:
      - wled:
          port: 21324
          blank_on_start: True
          sync_group_mask: 0
      - addressable_rainbow:
          name: Rainbow
      - addressable_scan:
          name: Scan
      - addressable_color_wipe:
          name: Wipe
      - addressable_twinkle:
         name: Twinkle