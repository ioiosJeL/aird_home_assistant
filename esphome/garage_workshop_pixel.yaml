substitutions:
  deviceName: workshop_pixel
  deviceUpper: Garage Workshop Pixel

  # WIFI AND OTHER CREDENTIALS. USE SECRETS WHERE POSSIBLE
  wifiPass: !secret wifiPassESP
  wifiSSID: !secret wifiSSIDESP
  passOTA: !secret passOTA
  
  # ESP DECLARATION
  boardPlatform: ESP8266
  boardName: d1_mini

  # ENTITY MAPPING FOR THE DIFFERENT FUNCTIONS
  climate: workshop # ID OF THERMOSTAT IN HA

  # CUSTOM OPTIONS
  alertTimeout: '30' # NUMBER OF SECONDS THE ALERTS WILL BE SHOWN
  climateLower: '5' # CLIMATE LOWER LIMIT
  climateUpper: '21' # CLIMATE UPPER LIMIT

  # SWITCH MAPPING. SELECT THE SWITCH FOR EACH ACTION
  switchMenu: ${sideSwitch}
  switchAction: ${encoderSwitch}

  
  # PIN MAPPING. DEFAULTS TO ioios.io PITHY AND COUNTER DEVICES
  encoderPinA: D5
  encoderPinB: D6
  encoderSwitch: D7
  i2cData: D1
  i2cClock: D2
  sideSwitch: TX
  neoPixels: RX
  
###############################################################################
# WHOA WHERE ARE YOU GOING? GO STEADY BEYOND HERE, THIS IS THE BREAKABLE BIT! #
###############################################################################

esphome:
  name: ${deviceName}
  friendly_name: ${deviceUpper}

esp8266:
  board: ${boardName}

wifi:
  ssid: ${wifiSSID}
  password: ${wifiPass}
  fast_connect: true
  
captive_portal:
logger:
ota:
  platform: esphome
  password: ${passOTA}
  
i2c:
  sda: ${i2cData}
  scl: ${i2cClock}
  scan: True
  frequency: 800kHz
  id: bus_a

time:
  - platform: homeassistant
    id: homeassistant_time
    
# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key_garage_workshop_pixel
  services:
    - service: alert_doorbell
      then:
        - script.execute: lastAction
        - light.turn_on:
            id: ${deviceName}_neopixel
            brightness: 80%
            effect: "Rainbow"

    - service: alert_dinnertime
      then:
        - script.execute: lastAction
        - light.turn_on:
            id: ${deviceName}_neopixel
            brightness: 80%
            effect: "Alarm Sequence"


###############################################################################
# WHOA WHERE ARE YOU GOING? GO STEADY BEYOND HERE, THIS IS THE BREAKABLE BIT! #
###############################################################################
 

globals:
  - id: lastAct
    type: int
    initial_value: '0'
    
  - id: uptimeSecs
    type: int
    initial_value: '0'
    
  - id: oneShot
    type: int
    initial_value: '0'
    
interval:
  - interval: 1sec
    then:
      - lambda: 'id(uptimeSecs) += 1;'
      - if:
          condition: 
              lambda: 'return (id(uptimeSecs) > (id(lastAct) + ${alertTimeout})) && id(oneShot) == 1;'
          then:
            - logger.log: "Turning Off Neopixels"
            - lambda: 'id(oneShot) = 0;'
            - light.turn_off:
                id: ${deviceName}_neopixel

script:
  - id: lastAction
    then:
      - lambda: 'id(oneShot) = 1;'
      - lambda: 'id(lastAct) = id(uptimeSecs);'
      
switch:
  - platform: restart
    name: "ESP Restart"
    
sensor:
  - platform: wifi_signal
    name: ESP Signal
    filters:
      - or:
          - throttle: 600s
          - delta: 5.0
    update_interval: 10s

  - platform: uptime
    name: ESP Uptime
    update_interval: 60s
    on_value:
      then:
        - globals.set:
            id: uptimeSecs
            value: !lambda |- 
              return x;
    

  - platform: homeassistant
    id: climate_current
    entity_id: climate.${climate}
    attribute: current_temperature
    internal: true

  - platform: homeassistant
    id: climate_setpoint
    entity_id: climate.${climate}
    attribute: temperature
    internal: true
    on_value:
      then:
        - sensor.rotary_encoder.set_value:
            id: rotary_dial
            value: !lambda 'return x;'
        - light.turn_on:
            id: ${deviceName}_neopixel
            brightness: 60%
            effect: "Climate Display"
        - script.execute: lastAction

  - platform: rotary_encoder
    id: rotary_dial
    pin_a:
      number: ${encoderPinA}
      inverted: true
      mode: INPUT_PULLUP
    pin_b:
      number: ${encoderPinB}
      inverted: true
      mode: INPUT_PULLUP
    filters:
      - debounce: 0.2s
    resolution: 1
    min_value: ${climateLower}
    max_value: ${climateUpper}
    on_value:
      then:
        - homeassistant.service:
            service: climate.set_temperature
            data_template:
              entity_id: climate.${climate}
              temperature: "{{ climate_target | int }}"
            variables:
              climate_target: !lambda 'return id(rotary_dial).state;'
              
text_sensor:
  - platform: homeassistant
    id: climate_state
    entity_id: climate.${climate}
    internal: true
    
binary_sensor:
  - platform: template
    id: api_connected

  - platform: homeassistant
    id: climate_output
    entity_id: binary_sensor.${climate}_climate_heating
    internal: true

  - platform: gpio
    pin:
      number: ${switchAction}
      inverted: true
      mode: INPUT_PULLUP
    name: Switch Action
    internal: true
    on_click:
      then:
        if:
          condition:
            lambda: 'return id(climate_state).state == "off";'
          then:
            - homeassistant.service:
                service: climate.turn_on
                data:
                  entity_id: climate.${climate}
          else:
            - homeassistant.service:
                service: climate.turn_off
                data:
                  entity_id: climate.${climate}    

  - platform: gpio
    pin:
      number: ${switchMenu}
      inverted: true
      mode: INPUT_PULLUP
    name: Switch Menu
    internal: true
    on_click:
      - min_length: 50ms
        max_length: 450ms
        then:
          - homeassistant.service:
              service: light.toggle
              data:
                entity_id: light.workshop_light

      - min_length: 450ms
        max_length: 5000ms
        then:
          - homeassistant.service:
              service: script.turn_on
              data:
                entity_id: script.workspace_shutdown_slow

light:
  - platform: neopixelbus
    type: GRB
    variant: ws2813
    pin: RX
    num_leds: 16
    id: ${deviceName}_neopixel
    name: "Ring"
    method:
      type: esp8266_dma
    effects:
      - addressable_rainbow:
          name: Rainbow
      - addressable_color_wipe:
          name: Colour Wipe
      - addressable_scan:
          name: Knight Rider
      - addressable_twinkle:
      - addressable_fireworks:
      - addressable_random_twinkle:
          name: Occasional Twinkle
          twinkle_probability: 1%
          progress_interval: 50ms
      - addressable_lambda:
          name: "Climate Display"
          update_interval: 50ms
          lambda: |-
            it.all() = Color::BLACK;
            
            // GET THE UPDATED CLIMATE SETPOINT VALUE
            int climate = id(climate_setpoint).state;
            
            // MAP THAT VALUE AGAINST THE 16 LEDS (RANGE 5 - 21 DEG C)
            // FROM ARDUINO MAP FUNCTION: return (x - in_min) * (out_max - out_min) / (in_max - in_min) + out_min;
            int outRange = (climate - 5) * (it.size() - 1) / (21 - 5) + 1; 
            
            // INVERT IT TO GO CLOCKWISE
            outRange = it.size() - outRange;
            
            int red = 0;
            int blue = 0;
            for (int i = it.size() - 1; i > outRange - 1; i--) {
              red = (15 - i) * 16;
              blue = i * 16;
              
              it[i] = Color(red, 0, blue);
            }
      - automation:
          name: Alarm Sequence
          sequence:
            - light.addressable_set:
                id: ${deviceName}_neopixel
                red: 100%
                green: 0%
                blue: 0%
            - delay: 400ms
            - light.addressable_set:
                id: ${deviceName}_neopixel
                red: 0%
                green: 0%
                blue: 0%
            - delay: 200ms
            - light.addressable_set:
                id: ${deviceName}_neopixel
                red: 100%
                green: 0%
                blue: 0%
            - delay: 400ms
            - light.addressable_set:
                id: ${deviceName}_neopixel
                red: 0%
                green: 0%
                blue: 0%
            - delay: 200ms
            - light.addressable_set:
                id: ${deviceName}_neopixel
                red: 100%
                green: 0%
                blue: 0%
            - delay: 400ms
            - light.addressable_set:
                id: ${deviceName}_neopixel
                red: 0%
                green: 0%
                blue: 0%
            - delay: 200ms
            - light.addressable_set:
                id: ${deviceName}_neopixel
                red: 100%
                green: 100%
                blue: 100%
            - delay: 100ms
            - light.addressable_set:
                id: ${deviceName}_neopixel
                red: 0%
                green: 0%
                blue: 100%
            - delay: 200ms
            - light.addressable_set:
                id: ${deviceName}_neopixel
                red: 100%
                green: 100%
                blue: 100%
            - delay: 100ms
            - light.addressable_set:
                id: ${deviceName}_neopixel
                red: 0%
                green: 0%
                blue: 0%
            - delay: 200ms