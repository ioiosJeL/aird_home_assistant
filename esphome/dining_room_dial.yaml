substitutions:
  deviceName: dining_room_dial
  deviceUpper: Dining Room Dial
  
  # ENTITY MAPPING FOR THE DIFFERENT FUNCTIONS
  mediaPlayer: dining_room_tv

  # ESP DECLARATION
  boardPlatform: ESP8266
  boardName: d1_mini
  
  # PIN MAPPING. DEFAULTS TO ioios.io PITHY AND COUNTER DEVICES
  encoderPinA: D5
  encoderPinB: D6
  encoderSwitch: D7
  i2cData: D4
  i2cClock: D3
  pirSensor: D0
  sideSwitch: TX
  neoPixels: RX
  
  # WIFI AND OTHER CREDENTIALS. USE SECRETS WHERE POSSIBLE
  wifiPass: !secret wifiPass
  wifiSSID: !secret wifiSSID
  passOTA: !secret passOTA

###############################################################################
# WHOA WHERE ARE YOU GOING? GO STEADY BEYOND HERE, THIS IS THE BREAKABLE BIT! #
###############################################################################

esphome:
  name: ${deviceName}
  friendly_name: ${deviceUpper}

esp8266:
  board: ${boardName}
      
wifi:
  ssid: ${wifiSSID}
  password: ${wifiPass}
  fast_connect: true

captive_portal:
logger:
ota:
  platform: esphome
  password: ${passOTA}
api:
  encryption:
    key: !secret api_key_dining_room_dial

i2c:
  sda: ${i2cData}
  scl: ${i2cClock}
  scan: True
  id: bus_a

globals:
  - id: new_volume
    type: float
    initial_value: '0'
    
  - id: uptimeSecs
    type: int
    initial_value: '0'

time:
  - platform: homeassistant
    id: homeassistant_time

switch:
  - platform: restart
    name: "ESP Restart"

text_sensor:
  - platform: homeassistant
    id: media_source
    entity_id: media_player.${mediaPlayer}
    attribute: source
    internal: true

sensor:
  - platform: wifi_signal
    name: ESP Signal
    filters:
      - or:
          - throttle: 600s
          - delta: 5.0
    update_interval: 10s

  - platform: uptime
    name: ESP Uptime
    update_interval: 60s
    on_value:
      then:
        - globals.set:
            id: uptimeSecs
            value: !lambda |- 
              return x;

  - platform: homeassistant
    id: media_volume
    entity_id: media_player.${mediaPlayer}
    attribute: volume_level
    internal: true
    on_value: 
      then:
        - sensor.rotary_encoder.set_value:
            id: rotary_dial
            value: !lambda 'return x * 100;'
            
        #- logger.log:
        #    format: "Volume changed to %.2f"
        #    args: [ 'id(media_volume).state' ]


  - platform: rotary_encoder
    id: rotary_dial
    pin_a:
      number: ${encoderPinA}
      inverted: true
      mode: INPUT_PULLUP
    pin_b:
      number: ${encoderPinB}
      inverted: true
      mode: INPUT_PULLUP
    filters:
      - debounce: 0.1s
      - lambda: |-
          if (x < 0.0) return 0.0;
          if (x > 100.0) return 100.0;
          return x;
    resolution: 1
    min_value: 0
    max_value: 100
    on_value: 
      then:
        - homeassistant.service:
            service: media_player.volume_set
            data:
              entity_id: media_player.${mediaPlayer}
            data_template:
              volume_level: '{{ final_vol }}'
            variables:
              final_vol: |-
                return (x / 100.0);

binary_sensor:
  - platform: gpio
    pin:
      number: ${encoderSwitch}
      inverted: true
      mode: INPUT_PULLUP
    name: Action ${deviceUpper}
    internal: true
    on_multi_click:
    - timing:
      - ON for at most 1s
      - OFF for at most 1s
      - ON for at most 1s
      - OFF for at least 0.2s
      then:
        - homeassistant.service:
            service: media_player.media_next_track
            data:
              entity_id: media_player.${mediaPlayer}

    - timing:
      - ON for 0.2s to 1.6s
      - OFF for at least 0.4s
      then:
        - homeassistant.service:
            service: media_player.media_play_pause
            data:
              entity_id: media_player.${mediaPlayer}
        - logger.log:
            format: "PLAY / PAUSE (%.2f)"
            args: [ 'id(media_source).state' ]

    - timing:
      - ON for 2s to 5s
      - OFF for at least 0.4s
      then:
        - homeassistant.service:
            service: media_player.toggle
            data:
              entity_id: media_player.${mediaPlayer}   

    - timing:
      - ON for 5s to 10s
      - OFF for at least 0.4s
      then:
        - homeassistant.service:
            service: script.turn_on
            data:
              entity_id: script.dining_room_tv_launch_youtube_video
light:
  - platform: neopixelbus
    type: GRB
    variant: WS2813
    pin: ${neoPixels}
    num_leds: 3
    id: ${deviceName}_neopixel
    name: "${deviceUpper} Ring"
    effects:
      - addressable_rainbow:
          name: Rainbow
      - addressable_scan:
          name: Scan
      - addressable_color_wipe:
          name: Wipe
      - addressable_twinkle:
         name: Twinkle