substitutions:
  deviceName: sunroom_dial
  deviceUpper: Sunroom Dial
  climate: sunroom

  # ESP DECLARATION
  boardPlatform: ESP8266
  boardName: d1_mini
  
  # PIN MAPPING. DEFAULTS TO ioios.io PITHY AND COUNTER DEVICES
  encoderPinA: D5
  encoderPinB: D6
  encoderSwitch: D7
  i2cData: D4
  i2cClock: D3
  pirSensor: D0
  sideSwitch: TX
  neoPixels: RX

  # EXTRA SWITCHES
  switchExtra: D4
  
  # WIFI AND OTHER CREDENTIALS. USE SECRETS WHERE POSSIBLE
  wifiPass: !secret wifiIoTPass
  wifiSSID: !secret wifiIoTSSID
  passOTA: !secret passOTA
  passESPH: !secret passESPH

###############################################################################
# WHOA WHERE ARE YOU GOING? GO STEADY BEYOND HERE, THIS IS THE BREAKABLE BIT! #
###############################################################################

esphome:
  name: ${deviceName}
  platform: ${boardPlatform}
  board: ${boardName}
  on_boot:
    priority: 200
    then:
      - binary_sensor.template.publish:
          id: api_connected
          state: OFF
      - wait_until:
          api.connected
      - delay: 15s
      - binary_sensor.template.publish:
          id: api_connected
          state: ON

wifi:
  ssid: ${wifiSSID}
  password: ${wifiPass}
  fast_connect: true

captive_portal:
logger:
ota:
  safe_mode: True
  password: ${passOTA}
  
time:
  - platform: homeassistant
    id: homeassistant_time
    
api:
  password: ${passESPH}
  
i2c:
  sda: ${i2cData}
  scl: ${i2cClock}
  scan: True
  id: bus_a
            
sensor:
  - platform: sht3xd
    temperature:
      name: "${deviceUpper} Temperature"
      id: ${deviceName}_temperature
    humidity:
      name: "${deviceUpper} Humidity"
      id: ${deviceName}_humidity
    address: 0x44
    update_interval: 8s

  - platform: rotary_encoder
    id: rotary_dial
    pin_a:
      number: ${encoderPinA}
      inverted: true
      mode: INPUT_PULLUP
    pin_b:
      number: ${encoderPinB}
      inverted: true
      mode: INPUT_PULLUP
    filters:
      - debounce: 0.1s
    resolution: 2
    min_value: 0
    max_value: 465


binary_sensor:
  - platform: template
    id: api_connected

  - platform: gpio
    pin:
      number: ${encoderSwitch}
      inverted: true
      mode: INPUT_PULLUP
    name: Action ${deviceUpper}
    internal: true
    on_multi_click:
    - timing:
      - ON for at most 1s
      - OFF for at most 1s
      - ON for at most 1s
      - OFF for at least 0.2s
      then:
        - light.turn_on:
            id: ${deviceName}_neopixel
            effect: Wipe
    - timing:
      - ON for 0.6s to 3s
      - OFF for at least 0.1s
      then:
        - light.turn_off:
            id: ${deviceName}_neopixel
    - timing:
      - ON for at most 0.5s
      - OFF for at least 0.4s
      then:
        - light.turn_on:
            id: ${deviceName}_neopixel
            effect: Scan                                            
    
    
light:
  - platform: neopixelbus
    type: GRB
    variant: WS2813
    pin: ${neoPixels}
    num_leds: 3
    id: ${deviceName}_neopixel
    name: "${deviceUpper} Ring"
    effects:
      - addressable_rainbow:
          name: Rainbow
      - addressable_scan:
          name: Scan
      - addressable_color_wipe:
          name: Wipe
      - addressable_twinkle:
         name: Twinkle