substitutions:
  deviceName: pithy_screen
  deviceUpper: Pithy Screen Default
  


  
  # ESP DECLARATION
  boardPlatform: ESP8266
  boardName: d1_mini
  
  # PIN MAPPING. DEFAULTS TO ioios.io PITHY AND COUNTER DEVICES
  encoderPinA: D5
  encoderPinB: D6
  encoderSwitch: D7
  i2cData: D4
  i2cClock: D3
  pirSensor: D0
  sideSwitch: D1
  neoPixels: RX

  # EXTRA SWITCHES
  switchExtra: D4
  
###############################################################################
# WHOA WHERE ARE YOU GOING? GO STEADY BEYOND HERE, THIS IS THE BREAKABLE BIT! #
###############################################################################

esphome:
  name: ${deviceName}
  platform: ${boardPlatform}
  board: ${boardName}
  on_boot:
    - light.turn_on:
        id: ${deviceName}_neopixel
        effect: Rainbow
      
logger:
  
i2c:
  sda: ${i2cData}
  scl: ${i2cClock}
  scan: True
  id: bus_a
  


            
font:
  - file: "fonts/LiberationSans-Regular.ttf"
    id: title_font
    size: 12
    glyphs: ":/HTPS"
  - file: "fonts/LiberationSans-Bold.ttf"
    id: title_font_bold
    size: 16
    glyphs: "ios."
  - file: "fonts/LiberationSans-Bold.ttf"
    id: small_font
    size: 16
    glyphs: ":/&!°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz ."
  - file: "fonts/LiberationSans-Regular.ttf"
    id: standard_font
    size: 26
    glyphs: ":/&!°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz ."
  - file: "fonts/LiberationSans-Regular.ttf"
    id: large_font
    size: 38
    glyphs: ":/&!°0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz ."

image:
  - file: "images/ioios.png"
    id: ioios_image
    resize: 48x48
  - file: "images/ha.png"
    id: ha_image
    resize: 48x48

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    address: 0x3C
    update_interval: 0.2s
    id: i2cDisplay
    pages:
      - id: pageMain
        lambda: |-

            it.printf(12, 3, id(title_font), TextAlign::TOP_LEFT, "HTTPS://");
            it.printf(124, 0, id(title_font_bold), TextAlign::TOP_RIGHT, "ioios.io");
            
            it.image(8, 16, id(ha_image));
            it.image(72, 16, id(ioios_image));
            
sensor:
  - platform: sht3xd
    temperature:
      name: "${deviceUpper} Temperature"
      id: ${deviceName}_temperature
    humidity:
      name: "${deviceUpper} Humidity"
      id: ${deviceName}_humidity
    address: 0x44
    update_interval: 15s
    

  - platform: rotary_encoder
    id: rotary_dial
    pin_a:
      number: ${encoderPinA}
      inverted: true
      mode: INPUT_PULLUP
    pin_b:
      number: ${encoderPinB}
      inverted: true
      mode: INPUT_PULLUP
    filters:
      - debounce: 0.1s
    resolution: 2
    min_value: 0
    max_value: 465



binary_sensor:
  - platform: gpio
    pin:
      number: ${encoderSwitch}
      inverted: true
      mode: INPUT_PULLUP
    name: Action ${deviceUpper}
    internal: true
    on_multi_click:
    - timing:
      - ON for at most 1s
      - OFF for at most 1s
      - ON for at most 1s
      - OFF for at least 0.2s
      then:
        - light.turn_on:
            id: ${deviceName}_neopixel
            effect: Wipe
    - timing:
      - ON for 0.6s to 3s
      - OFF for at least 0.1s
      then:
        - light.turn_off:
            id: ${deviceName}_neopixel
    - timing:
      - ON for at most 0.5s
      - OFF for at least 0.4s
      then:
        - light.turn_on:
            id: ${deviceName}_neopixel
            effect: Scan                                            
    
    
light:
  - platform: neopixelbus
    type: GRB
    variant: WS2813
    pin: ${neoPixels}
    num_leds: 3
    id: ${deviceName}_neopixel
    name: "${deviceUpper} Ring"
    effects:
      - addressable_rainbow:
          name: Rainbow
      - addressable_scan:
          name: Scan
      - addressable_color_wipe:
          name: Wipe
      - addressable_twinkle:
         name: Twinkle