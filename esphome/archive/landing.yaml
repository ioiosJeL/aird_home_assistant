substitutions:
  # UNIQUE NAME FOR THE DEVICE
  deviceName: landing
  deviceUpper: Landing

  passOTA: !secret passOTA
  passESPH: !secret passESPH
  
  # ESP DECLARATION
  boardPlatform: ESP32
  boardName: esp-wrover-kit
  
  ###############################################################################
  # WHOA WHERE ARE YOU GOING? GO STEADY BEYOND HERE, THIS IS THE BREAKABLE BIT! #
  ###############################################################################
  
esphome:
  name: ${deviceName}
  platform: ${boardPlatform}
  board: ${boardName}
  
  
logger:
ota:
  safe_mode: True
  password: ${passOTA}
    
time:
  - platform: homeassistant
    id: homeassistant_time
      
api:
  password: ${passESPH}
  
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO17_OUT
  phy_addr: 0
  
binary_sensor:
  - platform: gpio
    pin: GPIO16
    name: "PIR: ${deviceUpper}"
    device_class: motion    
    
switch:
  - platform: restart
    name: "ESP Restart ${deviceUpper}"
    
sensor:
  - platform: dht
    model: DHT22
    pin: GPIO33
    temperature:
      name: "${deviceUpper} Temperature"
    humidity:
      name: "${deviceUpper} Humidity"
    update_interval: 30s
    
  - platform: uptime
    name: "ESP Uptime ${deviceUpper}"
    update_interval: 60s